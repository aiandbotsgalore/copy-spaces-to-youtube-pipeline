name: Auto-Detect & Ingest Spaces

on:
  schedule:
    # Runs twice per hour at :13 and :43 (offset from congested :00/:30 slots)
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      x_handles:
        description: 'Comma-separated X handles to scan (no @) e.g. LoganBlack,ShaneB_Official'
        required: false
        default: 'LoganBlack'
        type: string
      x_handle:
        description: 'Single handle (legacy fallback)'
        required: false
        type: string
      limit:
        description: 'Number of recent tweets to scan per handle'
        required: false
        default: '20'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  detect-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Auto-Detect & Trigger Ingestion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Supports either input parameter or defaults to LoganBlack
          X_HANDLES: ${{ inputs.x_handles || inputs.x_handle || 'LoganBlack' }}
          TWEET_LIMIT: ${{ inputs.limit || '20' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/auto_detect_spaces.mjs
