name: Auto-Detect & Ingest Spaces

on:
  schedule:
    # Runs every 2 hours at :13 (offset from congested :00 slots)
    - cron: '13 */2 * * *'
  workflow_dispatch:
    inputs:
      x_handles:
        description: 'Comma-separated X handles to scan (no @) e.g. LoganBlack,ShaneB_Official'
        required: false
        default: 'LoganBlack'
        type: string
      x_handle:
        description: 'Single handle (legacy fallback)'
        required: false
        type: string
      limit:
        description: 'Number of recent tweets to scan per handle'
        required: false
        default: '20'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  detect-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Auto-Detect & Trigger Ingestion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          # Supports either input parameter or defaults to LoganBlack
          X_HANDLES: ${{ inputs.x_handles || inputs.x_handle || 'LoganBlack' }}
          TWEET_LIMIT: ${{ inputs.limit || '20' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/auto_detect_spaces.mjs
