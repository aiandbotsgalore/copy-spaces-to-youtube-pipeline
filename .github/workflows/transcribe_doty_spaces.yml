name: Transcribe Doty Spaces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate secrets
        run: |
          if [[ -z "$ASSEMBLYAI_API_KEY" ]]; then
            echo "::error::Missing ASSEMBLYAI_API_KEY secret"
            exit 1
          fi

      - name: Transcribe Doty release assets
        run: |
          python3 scripts/transcribe_doty_spaces.py \
            --repo "$REPO" \
            --github-token "$GH_TOKEN" \
            --assemblyai-api-key "$ASSEMBLYAI_API_KEY" \
            --output-dir transcripts/doty

      - name: Upload transcript artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doty-space-transcripts
          path: transcripts/doty
          if-no-files-found: error

      - name: Write summary
        run: |
          echo "## Doty transcripts" >> "$GITHUB_STEP_SUMMARY"
          find transcripts/doty -maxdepth 1 -type f | sort | while read -r file; do
            echo "- ${file}" >> "$GITHUB_STEP_SUMMARY"
          done
