name: Transcribe Doty Spaces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate secrets
        run: |
          if [[ -z "$ASSEMBLYAI_API_KEY" ]]; then
            echo "::error::Missing ASSEMBLYAI_API_KEY secret"
            exit 1
          fi

      - name: Transcribe Doty release assets
        id: transcribe
        continue-on-error: true
        run: |
          python3 scripts/transcribe_doty_spaces.py \
            --repo "$REPO" \
            --github-token "$GH_TOKEN" \
            --assemblyai-api-key "$ASSEMBLYAI_API_KEY" \
            --output-dir transcripts/doty

      - name: Upload transcript artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doty-space-transcripts
          path: |
            transcripts/doty/**/*.txt
            transcripts/doty/**/*.json
            transcripts/doty/**/*.md
          if-no-files-found: warn

      - name: Write summary
        if: always()
        run: |
          echo "## Doty transcripts" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f transcripts/doty/SUMMARY.md ]]; then
            cat transcripts/doty/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          elif [[ -d transcripts/doty ]]; then
            find transcripts/doty -maxdepth 1 -type f | sort | while read -r file; do
              echo "- ${file}" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "- No transcript output directory created" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if any transcription failed
        if: steps.transcribe.outcome != 'success'
        run: |
          echo "::error::One or more Doty transcriptions failed. See uploaded artifacts and workflow summary."
          exit 1

