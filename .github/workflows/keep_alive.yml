name: Keep Workflows Alive

# GitHub automatically disables scheduled workflows after 60 days of repo
# inactivity. This workflow runs monthly to keep the repo alive and prevent
# that from happening to the auto_detect_spaces and monitor workflows.

on:
  schedule:
    # Runs on the 1st of every month at 12:00 UTC
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Re-enabling scheduled workflows to prevent GitHub auto-disable..."

          # Re-enable each scheduled workflow explicitly via GitHub API
          for workflow in auto_detect_spaces.yml monitor.yml keep_alive.yml; do
            echo "Enabling: $workflow"
            gh workflow enable "$workflow" || echo "  (already enabled or not found: $workflow)"
          done

      - name: Touch keep-alive marker
        run: |
          echo "last_keepalive=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/keepalive
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: monthly keep-alive to prevent scheduled workflow disable" || echo "No changes"
          git push
