name: Cloud GPU Transcribe (Kaggle)
run-name: Kaggle GPU Transcribe (${{ inputs.release_tag || 'Auto-Queue Batch' }})

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Specific release tag to transcribe (leave empty to process queue)'
        required: false
        default: ''
        type: string
      batch_limit:
        description: 'Maximum episodes to transcribe in this batch'
        required: false
        default: '5'
        type: string

concurrency:
  group: kaggle-gpu-transcribe
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  launch-kaggle-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-worker.txt
            requirements-knowledge.txt

      - name: Install Kaggle CLI
        run: pip install -r requirements-worker.txt

      - name: Prepare Kaggle Kernel Payload
        env:
          TARGET_TAG: ${{ inputs.release_tag }}
          BATCH_LIMIT: ${{ inputs.batch_limit || '5' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "[*] Injecting environment parameters into Kaggle worker script..."
          # Prepend environment variables so the worker runs with runtime tokens
          cat << 'EOF' > scripts/kaggle_worker/env_bootstrap.py
          import os
          os.environ["TARGET_RELEASE_TAG"] = "${{ inputs.release_tag }}"
          os.environ["BATCH_LIMIT"] = "${{ inputs.batch_limit || '5' }}"
          os.environ["GH_TOKEN"] = "${{ secrets.GITHUB_TOKEN }}"
          os.environ["HF_TOKEN"] = "${{ secrets.HF_TOKEN }}"
          os.environ["GITHUB_REPOSITORY"] = "${{ github.repository }}"
          EOF
          
          # Combine bootstrap with worker
          cat scripts/kaggle_worker/env_bootstrap.py scripts/kaggle_worker/transcribe_worker.py > scripts/kaggle_worker/worker_final.py
          mv scripts/kaggle_worker/worker_final.py scripts/kaggle_worker/transcribe_worker.py
          rm -f scripts/kaggle_worker/env_bootstrap.py

      - name: Dispatch Kaggle Dual-T4 GPU Worker
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "[*] Pushing kernel to Kaggle cloud GPU pool..."
          kaggle kernels push -p scripts/kaggle_worker --accelerator NvidiaTeslaT4
          echo "[✓] Kaggle Dual-T4 GPU Worker successfully initiated!"

      - name: Monitor Cloud GPU Execution
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          KERNEL_ID="loganblackjbjb/spacepipe-transcriber"
          echo "[*] Monitoring status of $KERNEL_ID..."
          
          for i in {1..90}; do
            STATUS=$(kaggle kernels status "$KERNEL_ID" | tr -d '\r')
            echo "[$i/90] $STATUS"
            
            if [[ "$STATUS" == *"COMPLETE"* ]]; then
              echo "[✓] Kaggle GPU Transcription Completed Successfully!"
              break
            elif [[ "$STATUS" == *"ERROR"* ]] || [[ "$STATUS" == *"FAILED"* ]]; then
              echo "[!] Kaggle GPU Transcription failed!"
              kaggle kernels output "$KERNEL_ID" -p ./kaggle_logs || true
              cat ./kaggle_logs/*.log || true
              exit 1
            fi
            sleep 30
          done

      - name: Rebuild Transcripts Search Index
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_transcripts_index.py || echo "[!] Search index build skipped"

      - name: Sync Investigative Knowledge Graph & Qdrant Cloud
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          CHEAPER_INFERENCE_API_KEY: ${{ secrets.CHEAPER_INFERENCE_API_KEY }}
          CHEAPER_INFERENCE_BASE_URL: ${{ secrets.CHEAPER_INFERENCE_BASE_URL }}
        run: |
          pip install -r requirements-knowledge.txt || true
          if [ -n "${{ inputs.release_tag }}" ]; then
            python scripts/extract_investigative_claims.py --episode "${{ inputs.release_tag }}" || echo "[!] Claim extraction skipped"
          fi
          python scripts/build_investigative_graph.py || echo "[!] Graph build skipped"
          python scripts/sync_qdrant_transcripts.py --quotes-only || echo "[!] Qdrant sync skipped"

      - name: Match & Label Enrolled Speakers
        if: always()
        run: |
          python scripts/apply_voice_profiles_to_transcripts.py || true
          python scripts/rescan_archive_speakers.py --all-speakers --heuristic-only || true

      - name: Extract AI Highlight Clips
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHEAPER_INFERENCE_API_KEY: ${{ secrets.CHEAPER_INFERENCE_API_KEY }}
          CHEAPER_INFERENCE_BASE_URL: ${{ secrets.CHEAPER_INFERENCE_BASE_URL }}
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            python scripts/find_and_cut_best_clips.py --release-tag "${{ inputs.release_tag }}" || true
          fi
          python scripts/batch_transcribe_queue.py --missing-clips --limit 3 || true
          python scripts/sync_clips_catalog.py || true

      - name: Commit Updated Search Index & Clips
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/transcripts/transcription_status.json public/transcripts/transcripts_summary_index.json public/transcripts/episodes public/clips/clips_catalog.json best_saved_clips public/transcripts/investigative_knowledge_graph.json || true
          git diff --staged --quiet || git commit -m "chore(transcripts): update search index, speaker labels, and highlight clips from Kaggle GPU run [skip ci]" || echo "No changes to commit"
          git fetch origin master
          git merge -X ours origin/master --no-edit || git pull --rebase -X ours origin master || true
          git push origin master || echo "Push skipped"

      - name: Trigger RSS Update & Web Deployment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering update_rss.yml to publish updated transcripts, clips, and RSS feeds..."
          gh workflow run update_rss.yml --ref master || echo "[!] Note: Could not trigger update_rss.yml"
