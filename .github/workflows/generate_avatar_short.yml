name: Generate Talking Avatar Short (EchoMimicV3 Cloud GPU)

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'URL or path to speech audio clip (MP3/WAV)'
        required: true
      avatar_image:
        description: 'URL or path to primary portrait image'
        required: false
        default: 'https://raw.githubusercontent.com/aiandbotsgalore/copy-spaces-to-youtube-pipeline/master/public/avatars/logan.jpg'
      layout:
        description: 'Stage layout mode'
        required: false
        default: 'stage_grid'
        type: choice
        options:
          - 'stage_grid'
          - 'split_screen'
          - 'solo'
      speakers_json:
        description: 'JSON array of speaker names participating in this clip'
        required: false
        default: '["Logan", "Angela"]'
      speaker_avatars_json:
        description: 'JSON map of speaker name to avatar photo URL'
        required: false
        default: '{}'
      speaker_segments_json:
        description: 'JSON array of clip-relative speaker turns: [{speaker,start,end}]'
        required: false
        default: '[]'
      prompt:
        description: 'Visual direction and caption bar title'
        required: false
        default: 'Twitter Spaces Live Stage Banter'
      aspect_ratio:
        description: 'Video aspect ratio'
        required: false
        default: '9:16'
        type: choice
        options:
          - '9:16'
          - '1:1'
          - '16:9'
      latent_steps:
        description: 'Number of denoising diffusion steps (6 standard, 4 for draft/preview)'
        required: false
        default: '6'
      target_release_tag:
        description: 'Optional GitHub release tag to attach finished video'
        required: false
        default: ''

concurrency:
  group: echomimic-avatar
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  animate-avatar:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-worker.txt'

      - name: Install video validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -n 1

      - name: Install Kaggle CLI
        run: pip install -r requirements-worker.txt

      - name: Prepare Kaggle Kernel Payload
        env:
          SPEECH_AUDIO: ${{ inputs.audio_url }}
          AVATAR_IMAGE: ${{ inputs.avatar_image }}
          LAYOUT: ${{ inputs.layout || 'stage_grid' }}
          SPEAKERS_JSON: ${{ inputs.speakers_json || '[]' }}
          SPEAKER_AVATARS_JSON: ${{ inputs.speaker_avatars_json || '{}' }}
          SPEAKER_SEGMENTS_JSON: ${{ inputs.speaker_segments_json || '[]' }}
          PROMPT: ${{ inputs.prompt }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio || '9:16' }}
          LATENT_STEPS: ${{ inputs.latent_steps || '6' }}
        run: |
          set -euo pipefail
          echo "[*] Injecting environment bootstrap into Kaggle avatar worker..."
          # Values are written as Python literals from the step environment. Interpolating the
          # dispatch inputs straight into code broke on any clip title or speaker name containing a
          # quote, and JSON on a single interpolated line was one stray backslash away from injection.
          python - <<'PY'
          import os
          import pathlib

          defaults = {
              "LAYOUT": "stage_grid",
              "SPEAKERS_JSON": "[]",
              "SPEAKER_AVATARS_JSON": "{}",
              "SPEAKER_SEGMENTS_JSON": "[]",
              "PROMPT": "Twitter Spaces Live Stage Banter",
              "ASPECT_RATIO": "9:16",
              "LATENT_STEPS": "6",
          }
          keys = [
              "SPEECH_AUDIO",
              "AVATAR_IMAGE",
              "LAYOUT",
              "SPEAKERS_JSON",
              "SPEAKER_AVATARS_JSON",
              "SPEAKER_SEGMENTS_JSON",
              "PROMPT",
              "ASPECT_RATIO",
              "LATENT_STEPS",
          ]
          lines = ['"""Runtime environment for the packaged avatar worker."""', "import os", ""]
          for key in keys:
              value = os.environ.get(key) or defaults.get(key)
              if value is None:
                  continue
              lines.append(f"os.environ[{key!r}] = {value!r}")
          target = pathlib.Path("scripts/kaggle_worker/echomimic_pkg/env_bootstrap.py")
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          cat scripts/kaggle_worker/echomimic_pkg/env_bootstrap.py scripts/kaggle_worker/echomimic_pkg/echomimic_animator.py > scripts/kaggle_worker/echomimic_pkg/worker_final.py
          mv scripts/kaggle_worker/echomimic_pkg/worker_final.py scripts/kaggle_worker/echomimic_pkg/echomimic_animator.py
          rm -f scripts/kaggle_worker/echomimic_pkg/env_bootstrap.py

          # Fail here, with the generated file in the log, rather than 20 minutes into a GPU run.
          python - <<'PY'
          import ast
          import pathlib

          source = pathlib.Path("scripts/kaggle_worker/echomimic_pkg/echomimic_animator.py").read_text(encoding="utf-8")
          ast.parse(source)
          print(source.splitlines()[0])
          print(source.splitlines()[1])
          print("[✓] Packaged avatar worker parses after bootstrap injection")
          PY

      - name: Dispatch Kaggle Tesla T4 GPU Worker
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "[*] Submitting EchoMimicV3 Live Stage kernel to Kaggle Cloud GPU pool..."
          for attempt in 1 2 3; do
            if kaggle kernels push -p scripts/kaggle_worker/echomimic_pkg --accelerator NvidiaTeslaT4; then
              echo "[✓] Kaggle GPU job successfully dispatched!"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "[!] Kaggle kernel dispatch failed after retries." >&2
              exit 1
            fi
            delay=$((5 * 2 ** (attempt - 1)))
            echo "[!] Kaggle dispatch failed; retrying in ${delay}s..." >&2
            sleep "$delay"
          done

      - name: Monitor Cloud GPU Execution
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          KERNEL_ID="loganblackjbjb/echomimicv3-avatar-animator"
          echo "[*] Monitoring status of $KERNEL_ID..."

          read_status_with_retry() {
            local attempt=1
            local delay=5
            while [ "$attempt" -le 5 ]; do
              local output
              if output=$(kaggle kernels status "$KERNEL_ID" 2>&1); then
                printf '%s' "$output"
                return 0
              fi
              echo "[!] Kaggle status request failed (attempt $attempt/5): $output" >&2
              if [ "$attempt" -eq 5 ]; then return 1; fi
              sleep "$delay"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          completed=false
          for i in {1..90}; do
            STATUS=$(read_status_with_retry | tr -d '\r') || {
              echo "[!] Could not read Kaggle status after retries." >&2
              exit 1
            }
            echo "[$i/90] $STATUS"
            
            if [[ "$STATUS" == *"COMPLETE"* ]]; then
              echo "[✓] Kaggle EchoMimicV3 Avatar Completed Successfully!"
              completed=true
              break
            elif [[ "$STATUS" == *"ERROR"* ]] || [[ "$STATUS" == *"FAILED"* ]] || [[ "$STATUS" == *"Cannot access"* ]] || [[ "$STATUS" == *"denied"* ]]; then
              echo "[!] Kaggle GPU execution error/inaccessible: $STATUS"
              python scripts/kaggle_download_with_retry.py --kernel-id "$KERNEL_ID" --output-dir ./kaggle_logs --attempts 3 --base-delay 5 || true
              cat ./kaggle_logs/*.log || true
              exit 1
            fi
            sleep 30
          done

          if [ "$completed" != true ]; then
            echo "[!] Kaggle kernel did not complete within the 45-minute monitor window." >&2
            exit 1
          fi

      - name: Upload cloud failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: talking-avatar-failure-${{ github.run_id }}
          path: kaggle_logs/**
          if-no-files-found: ignore

      - name: Download Rendered Talking Avatar Video
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          KERNEL_ID="loganblackjbjb/echomimicv3-avatar-animator"
          python scripts/kaggle_download_with_retry.py \
            --kernel-id "$KERNEL_ID" \
            --output-dir ./kaggle_avatar_out \
            --attempts 7 \
            --base-delay 5 \
            --require-mp4 \
            --require-motion-report

          echo "[*] Rendered output contents:"
          find kaggle_avatar_out -maxdepth 3 -type f -printf '%p (%s bytes)\n'

      - name: Upload Video as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talking-avatar-short
          path: kaggle_avatar_out/**/*.mp4
          if-no-files-found: error

      - name: Publish combined MP4 for direct viewing
        if: ${{ inputs.target_release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.target_release_tag }}"
          FILE="kaggle_avatar_out/avatar_output/talking_avatar_short.mp4"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Spaces Live Stage talking-avatar test" \
              --notes "Cloud-only five-speaker talking-avatar test."
          gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
