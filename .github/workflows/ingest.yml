name: Ingest Space

on:
  push:
    paths:
      - 'space_queue.txt'
  workflow_dispatch:
    inputs:
      space_url:
        description: 'Space/Audio URL (Twitter, YouTube, Clubhouse, LinkedIn, etc.)'
        required: false
        type: string

# Prevent race conditions during RSS deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      mp3_path: ${{ steps.process.outputs.mp3_path }}
      release_tag: ${{ steps.process.outputs.release_tag }}
      space_title: ${{ steps.process.outputs.space_title }}
      space_id: ${{ steps.process.outputs.space_id }}
      episode_date: ${{ steps.process.outputs.episode_date }}
      duration: ${{ steps.duration.outputs.duration }}
      already_exists: ${{ steps.process.outputs.already_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: python3 -m pip install -U -r requirements.txt

      - name: Run Ingest Script
        id: process
        env:
          MANUAL_URL: ${{ inputs.space_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash ./scripts/ingest.sh

      - name: Extract MP3 Duration
        id: duration
        if: success() && steps.process.outputs.already_exists != 'true'
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "${{ steps.process.outputs.mp3_path }}" \
            | awk '{printf "%02d:%02d:%02d", ($1/3600), ($1%3600/60), ($1%60)}')
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Clear Queue File
        if: success() && steps.process.outputs.already_exists != 'true' && inputs.space_url == ''
        run: |
          echo "# SpacePipe: paste a URL here and commit to trigger the pipeline" > space_queue.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: clear processed space from queue [skip ci]" || echo "No changes to commit"
          git push

      - name: Clear Queue File on Duplicate Detection
        if: success() && steps.process.outputs.already_exists == 'true' && inputs.space_url == ''
        run: |
          echo "# SpacePipe: paste a URL here and commit to trigger the pipeline" > space_queue.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: clear duplicate URL from queue [skip ci]" || echo "No changes to commit"
          git push

      - name: Create Release
        if: success() && steps.process.outputs.already_exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.process.outputs.release_tag }}
          name: "${{ steps.process.outputs.space_title }}"
          files: |
            ${{ steps.process.outputs.mp3_path }}
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            - **Space Title:** ${{ steps.process.outputs.space_title }}
            - **Duration:** ${{ steps.duration.outputs.duration }}
            - **Processed:** ${{ steps.process.outputs.release_tag }}
            - **Source ID:** ${{ steps.process.outputs.space_id }}

            ---
            METADATA::DURATION::${{ steps.duration.outputs.duration }}
            METADATA::SOURCE_ID::${{ steps.process.outputs.space_id }}
            METADATA::EPISODE_DATE::${{ steps.process.outputs.episode_date }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger GPU Transcription on Local Runner
        if: success() && steps.process.outputs.already_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching transcribe_episode.yml for release: ${{ steps.process.outputs.release_tag }}"
          gh workflow run transcribe_episode.yml -f release_tag="${{ steps.process.outputs.release_tag }}" || echo "Workflow dispatch failed or runner offline"


  rss:
    needs: ingest
    if: needs.ingest.result == 'success' && needs.ingest.outputs.already_exists != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate RSS Feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PODCAST_TITLE: "Logan Black's X-Space"
          PODCAST_DESC: "Logan Black's X-Space Podcast Archive"
          PODCAST_AUTHOR: "Logan Black"
          PODCAST_EMAIL: "loganblack0@gmail.com"
          PODCAST_IMAGE: ""
        run: |
          cat <<'PYEOF' > generate_rss.py
          import os, json, re, urllib.request
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          title = os.environ.get("PODCAST_TITLE", "Logan Black's X-Space")
          desc = os.environ.get("PODCAST_DESC", "Logan Black's X-Space Podcast Archive")
          author = os.environ.get("PODCAST_AUTHOR", "Logan Black")
          email = os.environ.get("PODCAST_EMAIL", "loganblack0@gmail.com")
          image_fallback = os.environ.get("PODCAST_IMAGE", "https://picsum.photos/1400/1400")

          owner, repo_name = repo.split("/", 1)
          github_pages_url = f"https://{owner}.github.io/{repo_name}/"
          rss_url = f"{github_pages_url}podcast.xml"
          image = f"{github_pages_url}artwork.jpg" if os.path.exists("artwork.jpg") else image_fallback

          # Fetch all releases (newest first)
          releases = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              )
              req.add_header("Authorization", f"token {token}")
              req.add_header("Accept", "application/vnd.github.v3+json")
              try:
                  with urllib.request.urlopen(req) as r:
                      batch = json.loads(r.read())
              except Exception as e:
                  print(f"Failed fetching releases page {page}: {e}")
                  exit(1)
              if not batch:
                  break
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          def extract_recorded_datetime(rel):
              body = rel.get("body", "") or ""
              tag = rel.get("tag_name", "") or ""
              name = rel.get("name", "") or ""
              pub = rel.get("published_at", "") or ""

              m = re.search(r"METADATA::EPISODE_DATE::(\d{4})[-/]?(\d{2})[-/]?(\d{2})", body)
              if m:
                  try:
                      return datetime(int(m.group(1)), int(m.group(2)), int(m.group(3)), 12, 0, 0, tzinfo=timezone.utc)
                  except Exception:
                      pass

              rec = re.search(r"\*\*Recorded:\*\*\s*(\d{4})[-/]?(\d{2})[-/]?(\d{2})", body)
              if rec:
                  try:
                      return datetime(int(rec.group(1)), int(rec.group(2)), int(rec.group(3)), 12, 0, 0, tzinfo=timezone.utc)
                  except Exception:
                      pass

              t = re.search(r"^(?:v)?(\d{4})[-_]?(\d{2})[-_]?(\d{2})", tag)
              if t:
                  try:
                      return datetime(int(t.group(1)), int(t.group(2)), int(t.group(3)), 12, 0, 0, tzinfo=timezone.utc)
                  except Exception:
                      pass

              n = re.search(r"\b(\d{4})[-/](\d{2})[-/](\d{2})\b", name)
              if n:
                  try:
                      return datetime(int(n.group(1)), int(n.group(2)), int(n.group(3)), 12, 0, 0, tzinfo=timezone.utc)
                  except Exception:
                      pass

              if pub:
                  try:
                      return datetime.strptime(pub, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
                  except Exception:
                      pass

              return datetime.now(timezone.utc)

          published = [r for r in releases if not r.get("draft") and not r.get("prerelease")]
          published = sorted(published, key=extract_recorded_datetime, reverse=True)
          total_eps = len(published)

          rss_items = []
          for idx, release in enumerate(published):
              dt = extract_recorded_datetime(release)
              rfc822 = dt.strftime("%a, %d %b %Y %H:%M:%S +0000")
              body = release.get("body", "")
              m = re.search(r"METADATA::DURATION::(\d{2}:\d{2}:\d{2})", body)
              duration = m.group(1) if m else "00:00:00"
              ep_num = total_eps - idx
              for asset in release.get("assets", []):
                  if asset["name"].endswith(".mp3"):
                      url = asset["browser_download_url"]
                      size = asset["size"]
                      guid = f"spacepipe-{asset['id']}"
                      t = escape(release.get("name", "Untitled Space"))
                      d = escape(desc)
                      lines = [
                          "  <item>",
                          f"    <title>{t}</title>",
                          f"    <description>{t}</description>",
                          f"    <itunes:summary>{t}</itunes:summary>",
                          f"    <itunes:subtitle>{t}</itunes:subtitle>",
                          f"    <link>{url}</link>",
                          f"    <pubDate>{rfc822}</pubDate>",
                          f'    <enclosure url="{url}" length="{size}" type="audio/mpeg"/>',
                          f'    <guid isPermaLink="false">{guid}</guid>',
                          f"    <itunes:duration>{duration}</itunes:duration>",
                          f"    <itunes:explicit>no</itunes:explicit>",
                          f"    <itunes:episode>{ep_num}</itunes:episode>",
                          "    <itunes:episodeType>full</itunes:episodeType>",
                          "  </item>",
                      ]
                      rss_items.append("\n".join(lines))

          lbd = datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S +0000")
          year = datetime.now(timezone.utc).year
          items_xml = "\n".join(rss_items)

          channel_lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<rss version="2.0"',
              '  xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd"',
              '  xmlns:atom="http://www.w3.org/2005/Atom"',
              '  xmlns:content="http://purl.org/rss/1.0/modules/content/">',
              '  <channel>',
              f'    <title>{escape(title)}</title>',
              f'    <link>{github_pages_url}</link>',
              f'    <description>{escape(desc)}</description>',
              f'    <language>en-us</language>',
              f'    <copyright>&#169; {year} {escape(author)}</copyright>',
              f'    <managingEditor>{escape(email)} ({escape(author)})</managingEditor>',
              f'    <lastBuildDate>{lbd}</lastBuildDate>',
              f'    <atom:link href="{rss_url}" rel="self" type="application/rss+xml"/>',
              f'    <itunes:author>{escape(author)}</itunes:author>',
              f'    <itunes:summary>{escape(desc)}</itunes:summary>',
              f'    <itunes:subtitle>{escape(desc)}</itunes:subtitle>',
              '    <itunes:owner>',
              f'      <itunes:name>{escape(author)}</itunes:name>',
              f'      <itunes:email>{escape(email)}</itunes:email>',
              '    </itunes:owner>',
              f'    <itunes:image href="{image}"/>',
              f'    <image><url>{image}</url><title>{escape(title)}</title><link>{github_pages_url}</link></image>',
              '    <itunes:category text="Technology"/>',
              '    <itunes:explicit>no</itunes:explicit>',
              '    <itunes:type>episodic</itunes:type>',
              items_xml,
              '  </channel>',
              '</rss>',
          ]

          rss = "\n".join(channel_lines)
          with open("podcast.xml", "w", encoding="utf-8") as f:
              f.write(rss)
          print(f"Generated podcast.xml with {len(rss_items)} episode(s)")
          PYEOF
          python3 generate_rss.py

      - name: Validate RSS
        run: |
          if ! grep -q '<rss version="2.0"' podcast.xml; then
            echo "Invalid RSS structure"
            exit 1
          fi
          echo "RSS validation passed"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
