name: Ingest Space
run-name: Ingest ${{ inputs.release_tag || inputs.space_url || 'Queue' }}

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'batch_queue.txt'
      - 'space_queue.txt'
  workflow_dispatch:
    inputs:
      space_url:
        description: 'Space/Audio URL (Twitter, YouTube, Clubhouse, LinkedIn, etc.)'
        required: false
        type: string
      record_live:
        description: 'Record live stream (allow capturing in-progress Space)'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Existing Release Tag for a pre-staged local audio upload (skips yt-dlp)'
        required: false
        type: string
  repository_dispatch:
    types: [ingest_space, ingest_url]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: ingest-${{ inputs.release_tag || inputs.space_url || github.run_id }}
      cancel-in-progress: false
    outputs:
      mp3_path: ${{ steps.process.outputs.mp3_path }}
      release_tag: ${{ steps.process.outputs.release_tag }}
      space_title: ${{ steps.process.outputs.space_title }}
      space_id: ${{ steps.process.outputs.space_id }}
      episode_date: ${{ steps.process.outputs.episode_date }}
      duration: ${{ steps.duration.outputs.duration }}
      already_exists: ${{ steps.process.outputs.already_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install yt-dlp
        run: python3 -m pip install -U -r requirements.txt

      - name: Run Ingest Script
        id: process
        env:
          MANUAL_URL: ${{ inputs.space_url || github.event.client_payload.space_url }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag }}
          # Live recording is strictly manual via workflow_dispatch; automated dispatch never records live.
          RECORD_LIVE: ${{ inputs.record_live || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
        run: |
          set -o pipefail
          bash ./scripts/ingest.sh 2>&1 | tee ingest.log

      - name: Extract MP3 Duration
        id: duration
        if: success() && steps.process.outputs.already_exists != 'true'
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "${{ steps.process.outputs.mp3_path }}" \
            | awk '{printf "%02d:%02d:%02d", ($1/3600), ($1%3600/60), ($1%60)}')
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Dequeue Processed Item
        if: success() && inputs.space_url == '' && inputs.release_tag == ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Dequeue from batch_queue.txt if present
          if [ -f batch_queue.txt ]; then
            python3 -c "import sys; lines = [l for l in open('batch_queue.txt', 'r', encoding='utf-8') if l.strip()]; open('batch_queue.txt', 'w', encoding='utf-8').writelines(lines[1:]) if lines else None"
          fi
          # Clear space_queue.txt if present
          if [ -f space_queue.txt ]; then
            echo "# SpacePipe: paste a URL here and commit to trigger the pipeline" > space_queue.txt
          fi
          git add batch_queue.txt space_queue.txt || true
          git commit -m "chore(queue): dequeue processed space [skip ci]" || echo "No changes to commit"
          git push || echo "Notice: Push skipped or no changes"

      - name: Quarantine Poison Pill from Queue
        if: failure() && steps.process.outcome == 'failure' && inputs.space_url == '' && inputs.release_tag == ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python3 - <<'EOF'
          import os
          if os.path.exists('batch_queue.txt'):
              with open('batch_queue.txt', 'r', encoding='utf-8') as f:
                  lines = [l for l in f if l.strip()]
              if lines:
                  failed_item = lines[0].strip()
                  with open('failed_queue.txt', 'a', encoding='utf-8') as fq:
                      fq.write(failed_item + '\n')
                  with open('batch_queue.txt', 'w', encoding='utf-8') as f:
                      f.writelines(lines[1:])
                  print(f"[!] Quarantined poison pill to failed_queue.txt: {failed_item}")
          EOF
          git add batch_queue.txt failed_queue.txt || true
          git commit -m "chore(queue): quarantine failed item to failed_queue.txt [skip ci]" || echo "No changes"
          git push || true

      - name: Quarantine Failure to GitHub Issues DLQ
        if: failure() && steps.process.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/report_dlq_issue.py \
            --workflow "Ingest Space" \
            --run-id "${{ github.run_id }}" \
            --target "${{ inputs.release_tag || inputs.space_url || 'Queue Item' }}" \
            --log-file "ingest.log" || true


      - name: Create Release
        if: success() && steps.process.outputs.already_exists != 'true' && inputs.release_tag == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.process.outputs.release_tag }}
          name: "${{ steps.process.outputs.space_title }}"
          files: |
            ${{ steps.process.outputs.mp3_path }}
            work/*.mp3
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            - **Space Title:** ${{ steps.process.outputs.space_title }}
            - **Duration:** ${{ steps.duration.outputs.duration }}
            - **Processed:** ${{ steps.process.outputs.release_tag }}
            - **Source ID:** ${{ steps.process.outputs.space_id }}

            ---
            METADATA::DURATION::${{ steps.duration.outputs.duration }}
            METADATA::SOURCE_ID::${{ steps.process.outputs.space_id }}
            METADATA::EPISODE_DATE::${{ steps.process.outputs.episode_date }}
            METADATA::HOST::${{ steps.process.outputs.host_handle }}
            METADATA::YOUTUBE_STATUS::UNLISTED
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize Staged Local Upload Release
        if: success() && steps.process.outputs.already_exists != 'true' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REL_TAG: ${{ steps.process.outputs.release_tag }}
          DURATION: ${{ steps.duration.outputs.duration }}
          NEEDS_UPLOAD: ${{ steps.process.outputs.needs_release_upload }}
        run: |
          python3 - <<'PYEOF'
          import os, re, json, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          tag = os.environ["REL_TAG"]
          dur = os.environ.get("DURATION", "00:00:00")
          headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json",
            "User-Agent": "SpacePipe-Ingest"
          }
          url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30.0) as r:
            rel = json.loads(r.read())
          body = rel.get("body") or ""
          if dur and dur != "00:00:00":
            if "METADATA::DURATION::" in body:
              body = re.sub(r"METADATA::DURATION::\S+", f"METADATA::DURATION::{dur}", body)
            else:
              body = body.rstrip() + f"\nMETADATA::DURATION::{dur}\n"
            body = re.sub(r"\*\*Duration:\*\*\s*\S+", f"**Duration:** {dur}", body)
            patch_url = f"https://api.github.com/repos/{repo}/releases/{rel['id']}"
            patch_req = urllib.request.Request(
              patch_url,
              data=json.dumps({"body": body}).encode("utf-8"),
              headers=headers,
              method="PATCH"
            )
            urllib.request.urlopen(patch_req, timeout=30.0).read()
            print(f"Updated staged release {tag} duration to {dur}")
          PYEOF
          if [[ "$NEEDS_UPLOAD" == "true" ]]; then
            echo "Uploading normalized/split MP3 assets to release $REL_TAG..."
            gh release upload "$REL_TAG" work/*.mp3 --clobber
          fi

      - name: Trigger Free Cloud GPU Transcription (Kaggle)
        if: success() && steps.process.outputs.already_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching kaggle_transcribe.yml for release: ${{ steps.process.outputs.release_tag }}"
          gh workflow run kaggle_transcribe.yml -f release_tag="${{ steps.process.outputs.release_tag }}" || echo "Workflow dispatch failed or runner offline"


  rss:
    needs: ingest
    if: needs.ingest.result == 'success' && needs.ingest.outputs.already_exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger RSS Update and Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Triggering update_rss.yml to compile web app, sync clips catalog, and deploy to GitHub Pages..."
          gh workflow run update_rss.yml --ref master || echo "[!] Note: update_rss.yml already triggered"
