name: Ingest Space

on:
  push:
    paths:
      - 'space_queue.txt'
  workflow_dispatch:
    inputs:
      space_url:
        description: 'Space/Audio URL (Twitter, YouTube, Clubhouse, LinkedIn, etc.)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.process.outputs.release_tag }}
      space_title: ${{ steps.process.outputs.space_title }}
      space_id: ${{ steps.process.outputs.space_id }}
      already_exists: ${{ steps.process.outputs.already_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run ingest script
        id: process
        env:
          MANUAL_URL: ${{ github.event.inputs.space_url || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash ./scripts/ingest.sh

      - name: Extract MP3 duration
        id: duration
        if: success() && steps.process.outputs.already_exists != 'true'
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "${{ steps.process.outputs.mp3_path }}" \
            | awk '{printf "%02d:%02d:%02d", ($1/3600), ($1%3600/60), ($1%60)}')
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: success() && steps.process.outputs.already_exists != 'true'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.process.outputs.release_tag }}
          name: "${{ steps.process.outputs.space_title }}"
          files: |
            ${{ steps.process.outputs.mp3_path }}
            work/*.info.json
          fail_on_unmatched_files: true
          body: |
            **Title:** ${{ steps.process.outputs.space_title }}
            **Host:** ${{ steps.process.outputs.host }} (@${{ steps.process.outputs.host_id }})
            **Duration:** ${{ steps.duration.outputs.duration }}
            **Listeners:** ${{ steps.process.outputs.listeners }}
            **Recorded:** ${{ steps.process.outputs.recorded }}
            **Source:** ${{ steps.process.outputs.source_url }}
            **Space ID:** ${{ steps.process.outputs.space_id }}

            ${{ steps.process.outputs.description }}

            ---
            METADATA::DURATION::${{ steps.duration.outputs.duration }}
            METADATA::SOURCE_ID::${{ steps.process.outputs.space_id }}
            METADATA::EPISODE_DATE::${{ steps.process.outputs.episode_date }}
            METADATA::BYTES::${{ steps.process.outputs.file_size }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clear queue file after successful release
        if: success() && steps.process.outputs.already_exists != 'true' && github.event_name == 'push'
        run: |
          echo "# SpacePipe: paste a URL here and commit to trigger the pipeline" > space_queue.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: clear processed space from queue [skip ci]" || echo "No changes to commit"
          git push

      - name: Clear queue file after duplicate detection
        if: success() && steps.process.outputs.already_exists == 'true' && github.event_name == 'push'
        run: |
          echo "# SpacePipe: paste a URL here and commit to trigger the pipeline" > space_queue.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: clear duplicate URL from queue [skip ci]" || echo "No changes to commit"
          git push

      - name: Trigger transcript generation
        if: success() && steps.process.outputs.already_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
        run: |
          if [[ -z "${ASSEMBLYAI_API_KEY:-}" ]]; then
            echo "::notice::ASSEMBLYAI_API_KEY is not set; skipping transcript generation."
            exit 0
          fi
          gh workflow run transcribe_episode.yml \
            --ref "${{ github.ref_name }}" \
            -f release_tag="${{ steps.process.outputs.release_tag }}"

      - name: Trigger RSS update
        if: success() && steps.process.outputs.already_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update_rss.yml --ref "${{ github.ref_name }}"
