name: Batch Transcribe Episodes (Newest to Oldest)
run-name: Batch Transcribe ${{ inputs.limit || '5' }} episodes via Kaggle Dual-T4 GPU

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of untranscribed episodes to process'
        required: false
        default: '5'
        type: string
      dry_run:
        description: 'Preview untranscribed queue in order without running transcription'
        required: false
        default: false
        type: boolean
      missing_clips:
        description: 'Process transcribed episodes that are missing highlight clips'
        required: false
        default: false
        type: boolean

concurrency:
  group: batch-transcribe
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  dispatch_batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Queue Dependencies
        run: pip install requests

      - name: Dry Run - Discover Queue
        if: inputs.dry_run == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIMIT="${{ inputs.limit || '5' }}"
          echo "[*] Discovering queue in dry-run mode (limit: $LIMIT)..."
          python scripts/batch_transcribe_queue.py --limit "$LIMIT" --dry-run

      - name: Process Missing Highlight Clips
        if: inputs.dry_run != true && inputs.missing_clips == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LIMIT="${{ inputs.limit || '5' }}"
          echo "[*] Extracting highlight clips for transcribed episodes missing clips (limit: $LIMIT)..."
          python scripts/batch_transcribe_queue.py --missing-clips --limit "$LIMIT"

      - name: Forward Batch to Kaggle Dual-T4 GPU Worker
        if: inputs.dry_run != true && inputs.missing_clips != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIMIT="${{ inputs.limit || '5' }}"
          echo "[*] Forwarding batch transcription queue (batch_limit=$LIMIT) to Kaggle Dual-T4 GPU worker..."
          gh workflow run kaggle_transcribe.yml -f batch_limit="$LIMIT"
          echo "[✓] Kaggle GPU batch job successfully dispatched!"
