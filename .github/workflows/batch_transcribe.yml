name: Batch Transcribe Episodes (Newest to Oldest)
run-name: Batch Transcribe ${{ inputs.limit || '10' }} episodes (Newest First)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of untranscribed episodes to process (e.g. 5, 10, 25)'
        required: false
        default: '10'
        type: string
      dry_run:
        description: 'Preview untranscribed queue in order without running Modal'
        required: false
        default: false
        type: boolean
  schedule:
    # Continuously transcribes batches of untranscribed episodes every 4 hours
    - cron: '0 */4 * * *'

concurrency:
  group: batch-transcribe
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  batch-transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install modal requests

      - name: Run Batch Transcription Queue (Newest to Oldest)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          export MODAL_TOKEN_ID=$(echo -n "$MODAL_TOKEN_ID" | tr -d '\r\n ' )
          export MODAL_TOKEN_SECRET=$(echo -n "$MODAL_TOKEN_SECRET" | tr -d '\r\n ' )
          DRY_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          python scripts/batch_transcribe_queue.py --limit "${{ inputs.limit || 10 }}" $DRY_ARG

      - name: Commit Updated Search Index and Status
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/transcripts/transcripts_search_index.json public/transcripts/transcription_status.json || true
          git commit -m "chore(transcripts): batch update transcripts index and status [skip ci]" || echo "No changes to commit"
          git pull --rebase origin master || true
          git push origin master || echo "Push skipped or already up to date"

      - name: Trigger RSS Update
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update_rss.yml --ref master || echo "[!] Note: Could not trigger update_rss.yml"
