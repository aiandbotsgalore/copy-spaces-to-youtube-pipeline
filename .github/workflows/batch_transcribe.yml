name: Batch Transcribe Episodes (Newest to Oldest)
run-name: Batch Transcribe ${{ inputs.limit || '5' }} episodes via AssemblyAI Cloud

on:
  schedule:
    # Autonomous queue drain: checks for untranscribed episodes every 3 hours
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of untranscribed episodes to process'
        required: false
        default: '5'
        type: string
      dry_run:
        description: 'Preview untranscribed queue in order without running transcription'
        required: false
        default: false
        type: boolean
      missing_clips:
        description: 'Process transcribed episodes that are missing highlight clips'
        required: false
        default: false
        type: boolean

concurrency:
  group: batch-transcribe
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  dispatch_batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-worker.txt'

      - name: Install Queue Dependencies
        run: pip install -r requirements-worker.txt

      - name: Dry Run - Discover Queue
        if: inputs.dry_run == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIMIT="${{ inputs.limit || '5' }}"
          echo "[*] Discovering queue in dry-run mode (limit: $LIMIT)..."
          python scripts/batch_transcribe_queue.py --limit "$LIMIT" --dry-run

      - name: Process Missing Highlight Clips
        if: inputs.dry_run != true && inputs.missing_clips == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          LIMIT="${{ inputs.limit || '5' }}"
          echo "[*] Extracting highlight clips for transcribed episodes missing clips (limit: $LIMIT)..."
          python scripts/batch_transcribe_queue.py --missing-clips --limit "$LIMIT"

      - name: Execute Batch Transcription via AssemblyAI Cloud
        id: run_batch
        if: inputs.dry_run != true && inputs.missing_clips != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          LIMIT="${{ inputs.limit || '5' }}"
          echo "[*] Executing batch transcription on AssemblyAI Cloud (limit: $LIMIT)..."
          python scripts/batch_transcribe_queue.py --engine assemblyai --limit "$LIMIT"
          echo "[✓] AssemblyAI batch transcription completed!"

      - name: Commit & Push Updated Transcripts
        if: inputs.dry_run != true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/transcripts/
          git commit -m "chore(transcripts): batch update transcripts index and status [skip ci]" || echo "No changes to commit"
          git pull --rebase origin master || true
          git push origin master || echo "Notice: Push skipped or up to date"

      - name: Trigger Web App & RSS Deployment
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update_rss.yml --ref master || echo "[!] Note: Could not trigger update_rss.yml"

      - name: Auto-Chain Next Batch
        if: inputs.dry_run != true && steps.run_batch.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Auto-chaining next batch (${{ steps.run_batch.outputs.remaining_count }} remaining)..."
          gh workflow run batch_transcribe.yml -f limit="${{ inputs.limit || '5' }}" || echo "Notice: Workflow dispatch skipped"
