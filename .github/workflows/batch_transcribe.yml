name: Batch Transcribe Episodes (Newest to Oldest)
run-name: Batch Transcribe ${{ inputs.limit || '10' }} episodes (Newest First)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of untranscribed episodes to process (e.g. 5, 10, 25)'
        required: false
        default: '5'
        type: string
      dry_run:
        description: 'Preview untranscribed queue in order without running transcription'
        required: false
        default: true
        type: boolean
      missing_clips:
        description: 'Process transcribed episodes that are missing highlight clips'
        required: false
        default: false
        type: boolean

concurrency:
  group: batch-transcribe
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  batch-transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests assemblyai

      - name: Run Batch Transcription Queue (Newest to Oldest)
        id: transcribe_step
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DRY_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          CLIPS_ARG=""
          if [ "${{ inputs.missing_clips }}" = "true" ]; then
            CLIPS_ARG="--missing-clips"
          fi
          python scripts/batch_transcribe_queue.py --limit "${{ inputs.limit || 10 }}" $DRY_ARG $CLIPS_ARG

      - name: Rebuild Transcripts Search Index
        if: always() && steps.transcribe_step.outcome != 'skipped' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_transcripts_index.py || echo "[!] Warning: Failed to rebuild transcripts search index"

      - name: Commit Updated Search Index and Status
        if: always() && steps.transcribe_step.outcome != 'skipped'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm --cached public/transcripts/transcripts_search_index.json 2>/dev/null || true
          git add public/transcripts/transcription_status.json public/transcripts/transcripts_summary_index.json || true
          git commit -m "chore(transcripts): batch update transcripts index and status [skip ci]" || echo "No changes to commit"
          git pull --rebase origin master || true
          git push origin master || echo "Push skipped or already up to date"

      - name: Trigger RSS Update
        if: always() && steps.transcribe_step.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update_rss.yml --ref master || echo "[!] Note: Could not trigger update_rss.yml"
