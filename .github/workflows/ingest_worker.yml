name: Ingest Worker

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch id"
        required: true
        type: string
      space_id:
        description: "Space id"
        required: true
        type: string
      state_branch:
        description: "State branch"
        required: false
        type: string
        default: "pipeline-state"

permissions:
  contents: write
  actions: write

concurrency:
  group: ingest-worker-${{ inputs.batch_id }}-${{ inputs.space_id }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp

      - name: Process Item Ingest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python scripts/ingest_worker.py \
            --repo "$REPO" \
            --token "$GH_TOKEN" \
            --state-branch "${{ inputs.state_branch }}" \
            --batch-id "${{ inputs.batch_id }}" \
            --space-id "${{ inputs.space_id }}"
