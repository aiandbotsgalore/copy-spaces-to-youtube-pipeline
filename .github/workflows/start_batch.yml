name: Start Batch Processing

on:
  push:
    paths:
      - "batch_queue.txt"
  workflow_dispatch:
    inputs:
      max_concurrent:
        description: "Max concurrent downloads (1-10)"
        required: false
        type: number
        default: 10

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install preflight dependency
        run: python -m pip install yt-dlp

      - name: Start Initial Jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MAX=${{ inputs.max_concurrent || 10 }}

          if [[ ! -f batch_queue.txt ]]; then
            echo "No batch_queue.txt found"
            exit 0
          fi

          # Count non-empty lines
          TOTAL=$(grep -c -v '^[[:space:]]*$' batch_queue.txt || echo "0")
          echo "Total URLs in queue: $TOTAL"

          if [[ "$TOTAL" -eq 0 ]]; then
            echo "Queue is empty"
            exit 0
          fi

          # Check how many are already running
          ACTIVE=$(gh run list --workflow=batch_ingest.yml -L 200 --json status 2>/dev/null | jq '[.[] | select(.status != "completed")] | length' || echo "0")
          echo "Currently active (queued/pending/running): $ACTIVE"

          # Calculate how many to start
          SLOTS=$((MAX - ACTIVE))
          if [[ "$SLOTS" -le 0 ]]; then
            echo "Already at max active limit ($ACTIVE)"
            exit 0
          fi

          echo "Starting $SLOTS new jobs..."

          TRIGGERED=0
          FILTERED=0
          CLAIM_ERRORS=0
          MAX_CLAIMS=$((SLOTS * 5))
          CLAIMS=0

          while [[ "$TRIGGERED" -lt "$SLOTS" && "$CLAIMS" -lt "$MAX_CLAIMS" ]]; do
            CLAIMS=$((CLAIMS + 1))
            set +e
            URL=$(python3 scripts/claim_queue_url.py --repo "$REPO" --queue-file batch_queue.txt --token "$GH_TOKEN" --branch "$BRANCH")
            CLAIM_STATUS=$?
            set -e

            if [[ "$CLAIM_STATUS" -eq 3 ]]; then
              echo "Queue empty while claiming URLs"
              break
            fi

            if [[ "$CLAIM_STATUS" -ne 0 ]]; then
              echo "Queue claim failed with status $CLAIM_STATUS"
              CLAIM_ERRORS=$((CLAIM_ERRORS + 1))
              continue
            fi

            if [[ -n "$URL" ]]; then
              set +e
              PREFLIGHT=$(python3 scripts/pre_flight.py --url "$URL" --timeout 45 2>/dev/null)
              PREFLIGHT_STATUS=$?
              set -e

              if [[ "$PREFLIGHT_STATUS" -ne 0 ]]; then
                FILTERED=$((FILTERED + 1))
                echo "Filtered URL before dispatch: $URL ${PREFLIGHT:+($PREFLIGHT)}"
                continue
              fi

              echo "Triggering: $URL"
              gh workflow run batch_ingest.yml -f url="$URL" -f from_queue=true || echo "Failed to trigger: $URL"
              TRIGGERED=$((TRIGGERED + 1))
              sleep 1
            fi
          done

          echo "Dispatch summary: triggered=$TRIGGERED filtered=$FILTERED claim_errors=$CLAIM_ERRORS attempted_claims=$CLAIMS slots=$SLOTS"
          {
            echo "### Batch Dispatch Summary"
            echo "- Slots requested: $SLOTS"
            echo "- Triggered: $TRIGGERED"
            echo "- Filtered (strict preflight): $FILTERED"
            echo "- Claim errors: $CLAIM_ERRORS"
            echo "- Claim attempts: $CLAIMS"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Done dispatching jobs"
