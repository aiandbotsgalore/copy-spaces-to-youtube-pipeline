name: Enroll Voice Profile

on:
  workflow_dispatch:
    inputs:
      speaker_name:
        description: 'Speaker Name (e.g. Angela, Logan, Rick Doty)'
        required: true
        type: string
      audio_url:
        description: 'Direct URL to an audio sample or episode MP3 (.wav, .mp3, .m4a)'
        required: true
        type: string
      role:
        description: 'Speaker Role (Host, Co-Host, Special Guest, Speaker)'
        required: false
        default: 'Speaker'
        type: string
      segments_json:
        description: 'Optional JSON array of [{"start": sec, "duration": sec}] turns to slice and average'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Optional episode release_tag to permanently update speaker label in transcript JSON'
        required: false
        default: ''
        type: string
      raw_speaker:
        description: 'Optional original speaker ID (e.g. Speaker 2) to permanently rename in episode JSON'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  issues: write
  packages: read

jobs:
  enroll:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/spacepipe-runner:latest
      options: --user root
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Pre-Baked Container Environment
        run: |
          python -c "import torch, speechbrain, soundfile; print('[✓] SpacePipe Pre-Baked AI Container Ready!')"
          ffmpeg -version | head -n 1

      - name: Prepare Sample Audio Clips (Fast HTTP Byte-Range Streaming)
        env:
          AUDIO_SRC: ${{ inputs.audio_url }}
          SEGMENTS_JSON: ${{ inputs.segments_json }}
        run: |
          mkdir -p speaker_samples/downloaded/clips
          python -c "
          import os, json, subprocess, shutil
          src = os.environ.get('AUDIO_SRC', '').strip()
          segs_raw = os.environ.get('SEGMENTS_JSON', '').strip()
          clips_dir = 'speaker_samples/downloaded/clips'
          extracted = 0

          # 1. Fast Path: Stream only the exact 5 clip byte-ranges directly via FFmpeg HTTP Range Requests
          if segs_raw and src.startswith('http'):
              try:
                  segs = json.loads(segs_raw)
                  for idx, s in enumerate(segs[:8], 1):
                      st = float(s.get('start', 0))
                      dur = float(s.get('duration', 8))
                      out_w = f'{clips_dir}/clip_{idx:02d}.wav'
                      r = subprocess.run(
                          ['ffmpeg', '-y', '-ss', str(st), '-t', str(dur), '-i', src, '-ar', '16000', '-ac', '1', out_w],
                          capture_output=True, timeout=45
                      )
                      if r.returncode == 0 and os.path.exists(out_w) and os.path.getsize(out_w) > 4000:
                          extracted += 1
                  if extracted > 0:
                      print(f'[✓] Stream-sliced {extracted} clip(s) directly via HTTP byte-range without downloading full MP3!')
              except Exception as e:
                  print('Direct stream slice notice:', e)

          # 2. Fallback: Download file if local path or no segments provided
          if extracted == 0:
              raw_in = 'speaker_samples/downloaded/input_raw'
              if src.startswith('http'):
                  subprocess.run(['curl', '-L', src, '-o', raw_in], check=True)
              elif os.path.exists(src):
                  shutil.copyfile(src, raw_in)
              else:
                  raise FileNotFoundError(f'Audio source not found: {src}')

              if segs_raw:
                  try:
                      segs = json.loads(segs_raw)
                      for idx, s in enumerate(segs[:8], 1):
                          st = float(s.get('start', 0))
                          dur = float(s.get('duration', 8))
                          out_w = f'{clips_dir}/clip_{idx:02d}.wav'
                          subprocess.run(['ffmpeg', '-y', '-ss', str(st), '-t', str(dur), '-i', raw_in, '-ar', '16000', '-ac', '1', out_w], check=True)
                          extracted += 1
                  except Exception as e:
                      print('Local segment slice fallback:', e)
              if extracted == 0:
                  subprocess.run(['ffmpeg', '-y', '-i', raw_in, '-t', '45', '-ar', '16000', '-ac', '1', f'{clips_dir}/clip_01.wav'], check=True)
          "

      - name: Enroll Audio Clips into voice_profiles.json (with Auto-Remediation & Retry)
        id: enroll_step
        run: |
          set +e
          python scripts/extract_speaker_clips.py --enroll "speaker_samples/downloaded/clips" --name "${{ inputs.speaker_name }}" 2>&1 | tee enrollment.log
          ENROLL_EXIT=${PIPESTATUS[0]}
          echo "enroll_exit=$ENROLL_EXIT" >> $GITHUB_OUTPUT
          if [ $ENROLL_EXIT -eq 0 ]; then
            echo "enroll_status=success" >> $GITHUB_OUTPUT
            echo "[✓] Voice enrollment completed on initial or internal retry pass."
          else
            echo "[!] Voice enrollment initial attempt exited with code $ENROLL_EXIT. Engaging Auto-Remediation Secondary Pass..."
            # Auto-Remediation: Ensure input_raw exists if fast-path stream slices failed
            if [ ! -f speaker_samples/downloaded/input_raw ]; then
              echo "[*] Downloading input_raw for remediation pass..."
              SRC="${{ inputs.audio_url }}"
              if [[ "$SRC" =~ ^http ]]; then
                curl -L "$SRC" -o speaker_samples/downloaded/input_raw || true
              elif [ -f "$SRC" ]; then
                cp "$SRC" speaker_samples/downloaded/input_raw || true
              fi
            fi

            # Auto-Remediation: apply 16kHz mono loudnorm + VAD to full input if stream slices failed
            mkdir -p speaker_samples/downloaded/remediated
            if [ -f speaker_samples/downloaded/input_raw ]; then
              ffmpeg -y -i speaker_samples/downloaded/input_raw -vn -ac 1 -ar 16000 -c:a pcm_s16le \
                -af "silenceremove=start_periods=1:start_duration=0.1:start_threshold=-38dB:detection=peak,loudnorm=I=-16:TP=-1.5:LRA=11" \
                -t 30 speaker_samples/downloaded/remediated/remediated_voice.wav || true
            fi
            
            if [ -f speaker_samples/downloaded/remediated/remediated_voice.wav ]; then
              echo "[*] Re-attempting enrollment with sanitized, loudnorm-filtered audio..."
              python scripts/extract_speaker_clips.py --enroll "speaker_samples/downloaded/remediated/remediated_voice.wav" --name "${{ inputs.speaker_name }}" 2>&1 | tee -a enrollment.log
              RETRY_EXIT=${PIPESTATUS[0]}
              if [ $RETRY_EXIT -eq 0 ]; then
                echo "enroll_status=healed" >> $GITHUB_OUTPUT
                echo "enroll_exit=0" >> $GITHUB_OUTPUT
                echo "[✓] Voice profile enrollment successfully HEALED on remediation pass!"
              else
                echo "enroll_status=failed" >> $GITHUB_OUTPUT
                echo "enroll_exit=$RETRY_EXIT" >> $GITHUB_OUTPUT
              fi
            else
              echo "enroll_status=failed" >> $GITHUB_OUTPUT
            fi
          fi
          set -e

      - name: Update Role & Permanently Relabel Episode Transcript
        if: steps.enroll_step.outputs.enroll_exit == '0'
        env:
          SPK_NAME: ${{ inputs.speaker_name }}
          SPK_ROLE: ${{ inputs.role }}
          REL_TAG: ${{ inputs.release_tag }}
          RAW_SPK: ${{ inputs.raw_speaker }}
        run: |
          python -c "
          import json, shutil, os
          name = os.environ.get('SPK_NAME', '').strip()
          role = os.environ.get('SPK_ROLE', 'Speaker').strip()
          rel_tag = os.environ.get('REL_TAG', '').strip()
          raw_spk = os.environ.get('RAW_SPK', '').strip()

          with open('voice_profiles.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          data.setdefault('profiles', {})
          if name in data['profiles']:
              data['profiles'][name]['role'] = role
          with open('voice_profiles.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
          if os.path.exists('public'):
              shutil.copyfile('voice_profiles.json', 'public/voice_profiles.json')

          if rel_tag and raw_spk and name:
              ep_path = f'public/transcripts/episodes/{rel_tag}.json'
              if os.path.exists(ep_path):
                  with open(ep_path, 'r', encoding='utf-8') as f:
                      ep = json.load(f)
                  changed = False
                  for seg in ep.get('segments', []):
                      if seg.get('speaker') == raw_spk or seg.get('raw_speaker') == raw_spk:
                          seg['speaker'] = name
                          changed = True
                  if changed:
                      spks = sorted(list({s.get('speaker', '') for s in ep.get('segments', []) if s.get('speaker')}))
                      ep['speakers'] = spks
                      with open(ep_path, 'w', encoding='utf-8') as f:
                          json.dump(ep, f, ensure_ascii=False, indent=2)
                      sum_path = 'public/transcripts/transcripts_summary_index.json'
                      if os.path.exists(sum_path):
                          with open(sum_path, 'r', encoding='utf-8') as f:
                              sum_data = json.load(f)
                          for item in sum_data:
                              if item.get('release_tag') == rel_tag:
                                  item['speakers'] = spks
                          with open(sum_path, 'w', encoding='utf-8') as f:
                              json.dump(sum_data, f, ensure_ascii=False, indent=2)
          "

      - name: Quarantine Failed Job to Dead-Letter Queue (DLQ)
        if: steps.enroll_step.outputs.enroll_exit != '0'
        env:
          SPK_NAME: ${{ inputs.speaker_name }}
          AUDIO_URL: ${{ inputs.audio_url }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          python -c "
          import json, os, time
          spk = os.environ.get('SPK_NAME', 'Unknown')
          audio = os.environ.get('AUDIO_URL', '')
          run_id = os.environ.get('RUN_ID', '0')
          repo = os.environ.get('REPO', '')
          server = os.environ.get('SERVER_URL', 'https://github.com')
          log_url = f'{server}/{repo}/actions/runs/{run_id}'

          root_cause = 'Unknown audio or speech extraction failure'
          if os.path.exists('enrollment.log'):
              with open('enrollment.log', 'r', encoding='utf-8', errors='ignore') as lf:
                  content = lf.read()
                  if 'All audio clips failed pre-flight' in content or 'VAD' in content:
                      root_cause = 'Audio pre-flight rejection: failed format or no continuous active speech (VAD < 1.0s)'
                  elif 'Model initialization failed' in content:
                      root_cause = 'Transient API/Model download failure: HuggingFace/SpeechBrain unreachable after 3 backoffs'
                  elif 'No embeddings could be extracted' in content:
                      root_cause = 'Low SNR or silent audio: no usable speech vector computed'
                  else:
                      lines = [l.strip() for l in content.splitlines() if l.strip()]
                      if lines:
                          root_cause = lines[-1][:200]

          dlq_entry = {
              'id': f'dlq_voice_{run_id}',
              'workflow': 'Enroll Voice Profile',
              'runId': int(run_id) if run_id.isdigit() else 0,
              'speakerName': spk,
              'audioUrl': audio,
              'failedAt': int(time.time() * 1000),
              'attempts': 3,
              'rootCause': root_cause,
              'logUrl': log_url,
              'status': 'quarantined'
          }

          profiles_file = 'voice_profiles.json'
          data = {'profiles': {}, 'dlq': []}
          if os.path.exists(profiles_file):
              try:
                  with open(profiles_file, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except Exception:
                  pass
          data.setdefault('dlq', [])
          data['dlq'] = [d for d in data['dlq'] if d.get('speakerName') != spk]
          data['dlq'].insert(0, dlq_entry)
          with open(profiles_file, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
          if os.path.exists('public'):
              with open('public/voice_profiles.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
          print(f'[!] Job quarantined to DLQ: {dlq_entry}')
          "

      - name: Commit and Push Updated voice_profiles.json & Episode Transcript
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add voice_profiles.json public/voice_profiles.json public/transcripts/episodes/ public/transcripts/transcripts_summary_index.json || true
          git diff --staged --quiet || (git commit -m "feat(voice): update voice profiles and telemetry for '${{ inputs.speaker_name }}' [skip ci]" && git pull --rebase origin master && git push origin master)

      - name: Quarantine Failure to GitHub Issues DLQ
        if: steps.enroll_step.outputs.enroll_exit != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/report_dlq_issue.py \
            --workflow "Enroll Voice Profile" \
            --run-id "${{ github.run_id }}" \
            --target "${{ inputs.speaker_name }}" \
            --log-file enrollment.log || true

      - name: Assert Step Result
        if: steps.enroll_step.outputs.enroll_exit != '0'
        run: |
          echo "::error title=Voice Enrollment Failed::All 3 healed fallback attempts failed. Job quarantined to Dead-Letter Queue (DLQ)."
          exit 1

