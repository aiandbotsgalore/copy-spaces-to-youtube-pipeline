name: Ingest Space

on:
  repository_dispatch:
    types: [ingest-space]
  workflow_dispatch:
    inputs:
      url:
        description: 'Twitter Space URL to download'
        required: true
        type: string
      from_queue:
        description: 'Internal flag indicating this run came from the queue dispatcher'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ingest-${{ github.event.client_payload.url || inputs.url }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Get URL
        id: url
        run: |
          URL="${{ github.event.client_payload.url || inputs.url }}"
          FROM_QUEUE="${{ inputs.from_queue }}"
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            FROM_QUEUE="true"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          SPACE_ID=$(echo "$URL" | grep -oE '[a-zA-Z0-9]+$')
          echo "space_id=$SPACE_ID" >> $GITHUB_OUTPUT
          echo "from_queue=$FROM_QUEUE" >> $GITHUB_OUTPUT
          echo "Processing: $SPACE_ID"

      - name: Check Existing Release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SPACE_ID="${{ steps.url.outputs.space_id }}"
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -Eq "_${SPACE_ID}$"; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "Space $SPACE_ID already has a release; skipping download/release."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Space
        id: download
        if: steps.existing.outputs.already_released != 'true'
        run: |
          mkdir -p work
          DATE=$(date +%Y%m%d)
          SPACE_ID="${{ steps.url.outputs.space_id }}"
          URL="${{ steps.url.outputs.url }}"

          echo "Downloading $URL..."

          yt-dlp \
            --retries 3 \
            --fragment-retries 3 \
            --no-playlist \
            --restrict-filenames \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --embed-metadata \
            --write-info-json \
            --output "work/${DATE}_${SPACE_ID}_%(title)s.%(ext)s" \
            "$URL"

          MP3_FILE=$(find work -name "*.mp3" | head -1)
          JSON_FILE=$(find work -name "*.info.json" | head -1)

          if [[ -z "$MP3_FILE" ]]; then
            echo "::error::No MP3 produced"
            exit 1
          fi

          # Extract metadata
          if [[ -f "$JSON_FILE" ]]; then
            TITLE=$(python3 -c "import json; print(json.load(open('$JSON_FILE')).get('title','Unknown'))" 2>/dev/null || echo "Unknown")
            UPLOADER=$(python3 -c "import json; print(json.load(open('$JSON_FILE')).get('uploader','Unknown'))" 2>/dev/null || echo "Unknown")
            UPLOADER_ID=$(python3 -c "import json; print(json.load(open('$JSON_FILE')).get('uploader_id',''))" 2>/dev/null || echo "")
            DESCRIPTION=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print((d.get('description') or '')[:500])" 2>/dev/null || echo "")
            VIEW_COUNT=$(python3 -c "import json; print(json.load(open('$JSON_FILE')).get('view_count',0) or 0)" 2>/dev/null || echo "0")
            RELEASE_DATE=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d.get('release_date') or d.get('upload_date') or '')" 2>/dev/null || echo "")
          else
            TITLE="Space_$SPACE_ID"
            UPLOADER="Unknown"
            UPLOADER_ID=""
            DESCRIPTION=""
            VIEW_COUNT="0"
            RELEASE_DATE=""
          fi

          # Clean title
          TITLE=$(echo "$TITLE" | tr '_' ' ')

          echo "mp3_file=$MP3_FILE" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "uploader=$UPLOADER" >> $GITHUB_OUTPUT
          echo "uploader_id=$UPLOADER_ID" >> $GITHUB_OUTPUT
          echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "view_count=$VIEW_COUNT" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT
          echo "release_tag=${DATE}_${SPACE_ID}" >> $GITHUB_OUTPUT

      - name: Get Duration
        id: duration
        if: steps.existing.outputs.already_released != 'true'
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "${{ steps.download.outputs.mp3_file }}" \
            | awk '{printf "%02d:%02d:%02d", ($1/3600), ($1%3600/60), ($1%60)}')
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.existing.outputs.already_released != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.download.outputs.release_tag }}
          name: "${{ steps.download.outputs.title }}"
          files: ${{ steps.download.outputs.mp3_file }}
          body: |
            **Title:** ${{ steps.download.outputs.title }}
            **Host:** ${{ steps.download.outputs.uploader }} (@${{ steps.download.outputs.uploader_id }})
            **Duration:** ${{ steps.duration.outputs.duration }}
            **Listeners:** ${{ steps.download.outputs.view_count }}
            **Recorded:** ${{ steps.download.outputs.release_date }}
            **Source:** ${{ steps.url.outputs.url }}
            **Space ID:** ${{ steps.url.outputs.space_id }}

            ${{ steps.download.outputs.description }}

            ---
            METADATA::DURATION::${{ steps.duration.outputs.duration }}
            METADATA::LISTENERS::${{ steps.download.outputs.view_count }}
            METADATA::DATE::${{ steps.download.outputs.release_date }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Next URL
        if: always() && steps.url.outputs.from_queue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MAX=10

          ACTIVE=$(gh run list --workflow=batch_ingest.yml -L 200 --json status | jq '[.[] | select(.status != "completed")] | length')
          echo "Currently active (queued/pending/running): $ACTIVE"

          SLOTS=$((MAX - ACTIVE))
          if [[ "$SLOTS" -le 0 ]]; then
            echo "Already at max active jobs"
            exit 0
          fi

          echo "Available slots: $SLOTS"
          for _ in $(seq 1 "$SLOTS"); do
            set +e
            NEXT_URL=$(python3 scripts/claim_queue_url.py --repo "$REPO" --queue-file batch_queue.txt --token "$GH_TOKEN" --branch "$BRANCH")
            CLAIM_STATUS=$?
            set -e

            if [[ "$CLAIM_STATUS" -eq 3 ]]; then
              echo "Queue empty"
              break
            fi

            if [[ "$CLAIM_STATUS" -ne 0 ]]; then
              echo "Failed to claim next URL (status $CLAIM_STATUS)"
              break
            fi

            if [[ -n "$NEXT_URL" ]]; then
              echo "Triggering: $NEXT_URL"
              gh workflow run batch_ingest.yml -f url="$NEXT_URL" -f from_queue=true || true
              sleep 1
            fi
          done
