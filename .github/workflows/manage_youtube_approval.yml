name: Manage YouTube Approval
run-name: YouTube Status -> ${{ inputs.status }} for ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag of the episode (e.g. 20260925_1qJDzWQRqWNKV)'
        required: true
        type: string
      status:
        description: 'Set YouTube Visibility / Approval Status'
        required: true
        default: 'APPROVED'
        type: choice
        options:
          - APPROVED
          - UNLISTED

permissions:
  contents: write
  actions: write

jobs:
  update-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Release Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          STATUS: ${{ inputs.status }}
        run: |
          echo "Fetching release notes for $TAG..."
          BODY=$(gh release view "$TAG" --json body -q .body)
          
          if [ -z "$BODY" ]; then
            echo "::error::Release $TAG not found or has empty notes."
            exit 1
          fi

          echo "Current body preview:"
          echo "$BODY" | tail -n 5

          # Replace existing METADATA::YOUTUBE tag if present, otherwise append
          if echo "$BODY" | grep -qE "METADATA::YOUTUBE(_STATUS)?::"; then
            python3 -c "
import os, re
tag = os.environ['TAG']
status = os.environ['STATUS']
body = os.environ['BODY']
updated = re.sub(r'METADATA::YOUTUBE(?:_STATUS)?::[A-Za-z0-9_-]+', f'METADATA::YOUTUBE_STATUS::{status}', body)
with open('updated_notes.txt', 'w', encoding='utf-8') as f:
    f.write(updated)
"
          else
            python3 -c "
import os
status = os.environ['STATUS']
body = os.environ['BODY']
updated = body.rstrip() + f'\nMETADATA::YOUTUBE_STATUS::{status}\n'
with open('updated_notes.txt', 'w', encoding='utf-8') as f:
    f.write(updated)
"
          fi

          gh release edit "$TAG" --notes-file updated_notes.txt
          echo "[✓] Successfully updated release $TAG with METADATA::YOUTUBE_STATUS::${STATUS}."

      - name: Trigger RSS Update and Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering update_rss.yml to publish updated podcast.xml..."
          gh workflow run update_rss.yml --ref master || echo "[!] Notice: Could not trigger update_rss.yml automatically"
