name: Manage YouTube Approval
run-name: "YouTube Status: ${{ inputs.status }} for ${{ inputs.release_tag }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag of the episode (e.g. 20260925_1qJDzWQRqWNKV)'
        required: true
        type: string
      status:
        description: 'Set YouTube Visibility / Approval Status'
        required: true
        default: 'APPROVED'
        type: choice
        options:
          - APPROVED
          - UNLISTED

permissions:
  contents: write
  actions: write

jobs:
  update-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Release Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/set_youtube_status.py --tag "${{ inputs.release_tag }}" --status "${{ inputs.status }}"

      - name: Trigger RSS Update and Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering update_rss.yml to publish updated podcast.xml..."
          gh workflow run update_rss.yml --ref master || echo "[!] Notice: Could not trigger update_rss.yml automatically"
