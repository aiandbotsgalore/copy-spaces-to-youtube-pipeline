name: Sync SpacesDashboard Speaker Queue

on:
  schedule:
    - cron: '15 */6 * * *' # Every 6 hours
  workflow_dispatch:
    inputs:
      handle:
        description: 'Twitter/X handle on SpacesDashboard to scan'
        required: true
        default: 'AngelaMaggard3'
      limit:
        description: 'Max new spaces to dispatch to ingest pipeline'
        required: true
        default: '5'
      dry_run:
        description: 'Check spaces without dispatching ingest workflow'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync_spaces:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          # --with-deps needs apt fonts; GitHub runners sometimes fail DNS to
          # azure.archive.ubuntu.com. Fall back to the browser binary alone.
          npx playwright install --with-deps chromium || {
            echo "::warning::Playwright OS deps failed; installing Chromium binary only"
            npx playwright install chromium
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Latest yt-dlp
        run: |
          python3 -m pip install --upgrade --no-cache-dir yt-dlp
          yt-dlp --version

      - name: Run SpacesDashboard Scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          SPACESDASHBOARD_HANDLE: ${{ inputs.handle || 'AngelaMaggard3' }}
          DISPATCH_LIMIT: ${{ inputs.limit || '5' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          node scripts/sync_spacesdashboard.mjs
