name: Transcribe Episode

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to transcribe (e.g. 20260902_1AJEmvwnykXJL)'
        required: true
        type: string

concurrency:
  group: transcribe-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install modal requests

      - name: Run Modal Cloud GPU Transcription
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "[*] Triggering Modal Serverless GPU transcription for ${{ inputs.release_tag }}..."
          modal run modal_transcriber.py --release-tag "${{ inputs.release_tag }}"

      - name: Trigger RSS Update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            gh workflow run update_rss.yml --ref master
          } catch {
            echo "[!] Note: Could not trigger update_rss.yml: $_"
          }
