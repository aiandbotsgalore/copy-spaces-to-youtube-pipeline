name: Transcribe Episode
run-name: Transcribe ${{ inputs.release_tag }} via ${{ inputs.engine || 'GitHub Cloud (whisper)' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to transcribe (e.g. 20260902_1AJEmvwnykXJL)'
        required: true
        type: string
      engine:
        description: 'Transcription engine (whisper = free GitHub Cloud, assemblyai = paid API)'
        required: false
        default: 'whisper'
        type: choice
        options:
          - whisper
          - assemblyai
      force:
        description: 'Force re-transcription even if transcript already exists'
        required: false
        default: true
        type: boolean

concurrency:
  group: transcribe-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-worker.txt'

      - name: Install Dependencies
        run: pip install -r requirements-worker.txt

      - name: Install System Audio Utilities (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Transcribe Episode (Cloud Runner)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          FORCE_ARG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          ENGINE_ARG="--engine ${{ inputs.engine || 'whisper' }}"
          echo "[*] Transcribing ${{ inputs.release_tag }} via engine '${{ inputs.engine || 'whisper' }}'..."
          python scripts/transcribe_and_diarize.py --release-tag "${{ inputs.release_tag }}" $FORCE_ARG $ENGINE_ARG

      - name: Rebuild Transcript Index & Refresh Discovered Speaker Candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_transcripts_index.py
          python scripts/speaker_tool.py scan-candidates

      - name: Commit & Push Updated Transcripts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/transcripts/ public/clips/
          git commit -m "chore(transcripts): update transcript index for ${{ inputs.release_tag }} [skip ci]" || echo "No changes to commit"
          git stash --include-untracked || true
          git pull --rebase origin master || true
          git stash pop || true
          git push origin master || (git pull --rebase origin master && git push origin master) || echo "Notice: Push skipped or up to date"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Generate Transcript Embeddings
        run: |
          npm run embeddings:generate -- --tag "${{ inputs.release_tag }}"

      - name: Upload Embeddings to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ls .cache/transcripts/${{ inputs.release_tag }}.embeddings.* 1> /dev/null 2>&1; then
            gh release upload "${{ inputs.release_tag }}" .cache/transcripts/${{ inputs.release_tag }}.embeddings.* --clobber || echo "Notice: Embeddings upload to release skipped or failed"
          fi

      - name: Trigger Web App & RSS Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update_rss.yml --ref master || echo "[!] Note: Could not trigger update_rss.yml"
