name: Transcribe Episode

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to transcribe (e.g. 20260503_1qGvvkOdEAzGB)'
        required: true
        type: string

concurrency:
  group: transcribe-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -q assemblyai

      - name: Download MP3 from Release
        id: download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, sys, time
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]

          def fetch_json(url, retries=5):
              for attempt in range(1, retries + 1):
                  req = urllib.request.Request(
                      url,
                      headers={"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.loads(r.read())
                  except Exception as e:
                      if attempt < retries:
                          time.sleep(3 * attempt)
                      else:
                          raise e

          try:
              release = fetch_json(f"https://api.github.com/repos/{repo}/releases/tags/{tag}")
          except Exception as e:
              print(f"::error::Could not fetch release {tag}: {e}")
              sys.exit(1)

          mp3_asset = next((a for a in release.get("assets", []) if a["name"].endswith(".mp3")), None)
          if not mp3_asset:
              print(f"::error::No MP3 asset found in release {tag}")
              sys.exit(1)

          mp3_url = mp3_asset["browser_download_url"]
          mp3_name = mp3_asset["name"]
          os.makedirs("work", exist_ok=True)
          out_path = f"work/{mp3_name}"
          print(f"Downloading {mp3_name} ({mp3_asset['size'] // (1024*1024)} MB)...")

          for attempt in range(1, 6):
              req2 = urllib.request.Request(mp3_url, headers={"Authorization": f"token {token}"})
              try:
                  with urllib.request.urlopen(req2, timeout=300) as r, open(out_path, "wb") as f:
                      while chunk := r.read(1024 * 1024):
                          f.write(chunk)
                  break
              except Exception as de:
                  if attempt < 5:
                      print(f"  Download hiccup on attempt {attempt}/5: {de}. Retrying...")
                      time.sleep(4 * attempt)
                  else:
                      print(f"::error::Failed downloading MP3: {de}")
                      sys.exit(1)

          print(f"Downloaded to {out_path}")
          release_name = release.get("name") or release.get("tag_name") or tag
          with open(os.environ["GITHUB_OUTPUT"], "a") as gho:
              gho.write(f"mp3_path={out_path}\n")
              gho.write(f"release_name={release_name}\n")
          PYEOF

      - name: Transcribe with AssemblyAI
        id: transcribe
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          MP3_PATH: ${{ steps.download.outputs.mp3_path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ steps.download.outputs.release_name }}
        run: |
          mkdir -p transcripts
          python3 - <<'PYEOF'
          import os, sys, json, time, urllib.request, re, subprocess

          api_key = os.environ.get("ASSEMBLYAI_API_KEY", "")
          if not api_key:
              print("::error::ASSEMBLYAI_API_KEY secret is not set.")
              sys.exit(1)

          mp3_path = os.environ.get("MP3_PATH", "")
          release_tag = os.environ.get("RELEASE_TAG", "")
          release_name = os.environ.get("RELEASE_NAME", "") or release_tag
          if not mp3_path or not os.path.exists(mp3_path):
              print(f"::error::MP3 file not found: {mp3_path}")
              sys.exit(1)

          base_name = os.path.splitext(os.path.basename(mp3_path))[0]
          txt_path = f"transcripts/{base_name}.txt"
          json_path = f"transcripts/{base_name}.json"

          def fmt(sec):
              s = int(sec)
              return f"{s // 3600:02d}:{(s % 3600) // 60:02d}:{s % 60:02d}"

          def request_with_retry(req, max_retries=5, initial_delay=4, is_json=True):
              for attempt in range(1, max_retries + 1):
                  try:
                      with urllib.request.urlopen(req, timeout=300) as r:
                          data = r.read()
                          return json.loads(data) if is_json else data
                  except urllib.error.HTTPError as he:
                      if he.code in (429, 500, 502, 503, 504) and attempt < max_retries:
                          delay = initial_delay * (2 ** (attempt - 1))
                          print(f"  ⚠️ HTTP {he.code} (attempt {attempt}/{max_retries}). Retrying in {delay}s...")
                          time.sleep(delay)
                      else:
                          body_err = he.read().decode('utf-8', errors='replace')
                          raise RuntimeError(f"HTTP {he.code}: {body_err}")
                  except Exception as e:
                      if attempt < max_retries:
                          delay = initial_delay * (2 ** (attempt - 1))
                          print(f"  ⚠️ Network glitch ({e}) on attempt {attempt}/{max_retries}. Retrying in {delay}s...")
                          time.sleep(delay)
                      else:
                          raise e

          # Speech conditioning pass
          opt_path = f"work/{base_name}_speech_opt.mp3"
          print(f"🎛️ Condition audio for speech: bandpass (75Hz-8.5kHz), loudnorm leveling, 24kHz mono...")
          ffmpeg_cmd = [
              "ffmpeg", "-y", "-i", mp3_path,
              "-af", "highpass=f=75,lowpass=f=8500,loudnorm=I=-16:LRA=11:TP=-1.5",
              "-ar", "24000", "-ac", "1",
              "-c:a", "libmp3lame", "-b:a", "64k",
              opt_path
          ]
          res = subprocess.run(ffmpeg_cmd, capture_output=True, text=True)
          upload_target = opt_path if res.returncode == 0 and os.path.exists(opt_path) else mp3_path
          if upload_target == opt_path:
              orig_mb = os.path.getsize(mp3_path) / (1024 * 1024)
              opt_mb = os.path.getsize(opt_path) / (1024 * 1024)
              print(f"✨ Speech optimized: {orig_mb:.1f} MB -> {opt_mb:.1f} MB ({(1 - opt_mb/orig_mb)*100:.0f}% reduction)")
          else:
              print(f"⚠️ Warning: ffmpeg enhancement failed ({res.stderr}), using original audio.")

          # Check duration with ffprobe to handle marathon Spaces (>6 hours)
          duration_sec = 0.0
          try:
              probe_res = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", upload_target],
                  capture_output=True, text=True, check=True
              )
              duration_sec = float(probe_res.stdout.strip())
          except Exception as pe:
              print(f"  Warning: ffprobe duration check: {pe}")

          MAX_CHUNK_SEC = 21600 # 6 hours max per AssemblyAI request
          chunks = []
          if duration_sec > MAX_CHUNK_SEC:
              print(f"✂️ Marathon Space detected ({duration_sec / 3600:.1f} hours). Splitting into {MAX_CHUNK_SEC // 3600}-hour chunks for AssemblyAI compatibility...")
              chunk_pattern = f"work/{base_name}_part_%03d.mp3"
              subprocess.run([
                  "ffmpeg", "-y", "-i", upload_target,
                  "-f", "segment", "-segment_time", str(MAX_CHUNK_SEC),
                  "-reset_timestamps", "1", "-c", "copy",
                  chunk_pattern
              ], check=True, capture_output=True)
              import glob
              chunks = sorted(glob.glob(f"work/{base_name}_part_*.mp3"))

          if not chunks:
              chunks = [upload_target]

          base_keyterms = [
              "LoganBlack", "Logan Black", "Rick Doty", "Richard Doty", "Shane", "Oor",
              "Lana", "Pants Down", "UAP", "UFO", "UFOs", "PeruAliens", "David Grusch",
              "disclosure", "extraterrestrial", "NHI", "A.I."
          ]
          if release_name:
              title_words = [w for w in re.split(r'[^a-zA-Z0-9]', release_name) if len(w) > 2]
              keyterms = list(dict.fromkeys(base_keyterms + title_words[:15]))
          else:
              keyterms = base_keyterms

          all_utterances = []
          all_texts = []
          distinct_speakers_set = set()
          model_used = "universal-3-5-pro"
          total_conf_sum = 0.0
          conf_count = 0

          for chunk_idx, chunk_file in enumerate(chunks, 1):
              time_offset_sec = (chunk_idx - 1) * MAX_CHUNK_SEC
              if len(chunks) > 1:
                  print(f"\n--- Transcribing Chunk {chunk_idx}/{len(chunks)} ({os.path.basename(chunk_file)}, offset +{time_offset_sec/3600:.1f}h) ---")

              print(f"📤 Uploading audio chunk to AssemblyAI...")
              upload_req = urllib.request.Request(
                  "https://api.assemblyai.com/v2/upload",
                  data=open(chunk_file, "rb").read(),
                  headers={"Authorization": api_key},
                  method="POST"
              )
              try:
                  upload_res = request_with_retry(upload_req, max_retries=5, initial_delay=5)
                  audio_url = upload_res["upload_url"]
              except Exception as ue:
                  print(f"::error::Failed uploading audio to AssemblyAI: {ue}")
                  sys.exit(1)
              print(f"✅ Uploaded chunk {chunk_idx} to AssemblyAI (audio URL ready)")

              print(f"🚀 Requesting AssemblyAI Universal-3.5 Pro transcription...")
              payload = json.dumps({
                  "audio_url": audio_url,
                  "speech_models": ["universal-3-5-pro", "universal-2"],
                  "language_code": "en",
                  "punctuate": True,
                  "format_text": True,
                  "speaker_labels": True,
                  "prompt": "Live X Space discussion covering UAP, UFOs, paranormal topics, science, technology, government, disclosure, and related current events.",
                  "keyterms_prompt": keyterms,
              }).encode("utf-8")

              create_req = urllib.request.Request(
                  "https://api.assemblyai.com/v2/transcript",
                  data=payload,
                  headers={
                      "Authorization": api_key,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  transcript = request_with_retry(create_req, max_retries=5, initial_delay=4)
              except Exception as ce:
                  print(f"::error::AssemblyAI request failed: {ce}")
                  sys.exit(1)

              transcript_id = transcript.get("id")
              if not transcript_id:
                  print(f"::error::AssemblyAI did not return a transcript id. Response: {transcript}")
                  sys.exit(1)
              print(f"⏳ Transcript queued with ID: {transcript_id}. Polling for completion...")

              poll_url = f"https://api.assemblyai.com/v2/transcript/{transcript_id}"
              poll_start = time.time()
              max_poll_seconds = 7200  # Up to 2 hours for long audio

              while (time.time() - poll_start) < max_poll_seconds:
                  poll_req = urllib.request.Request(poll_url, headers={"Authorization": api_key})
                  try:
                      transcript = request_with_retry(poll_req, max_retries=4, initial_delay=4)
                  except Exception as pe:
                      print(f"  ⚠️ Poll request hiccup ({pe}), continuing polling loop...")
                      time.sleep(10)
                      continue

                  status = transcript.get("status")
                  if status == "completed":
                      break
                  if status == "error":
                      print(f"::error::AssemblyAI transcription failed with status 'error'!")
                      print(f"  Transcript ID: {transcript_id}")
                      print(f"  Error message: {transcript.get('error')}")
                      sys.exit(1)

                  elapsed = int(time.time() - poll_start)
                  if elapsed % 60 < 15:
                      print(f"  [{elapsed // 60}m {elapsed % 60}s elapsed] Status: {status}...")
                  time.sleep(12)

              if not transcript or transcript.get("status") != "completed":
                  print(f"::error::AssemblyAI transcription timed out after {max_poll_seconds // 60} minutes.")
                  sys.exit(1)

              model_used = transcript.get("speech_model_used") or model_used
              if transcript.get("confidence"):
                  total_conf_sum += transcript.get("confidence")
                  conf_count += 1
              if transcript.get("text"):
                  all_texts.append(transcript.get("text").strip())

              chunk_utts = transcript.get("utterances") or []
              for u in chunk_utts:
                  spk = f"Speaker {u.get('speaker')}" if not str(u.get('speaker')).startswith("Speaker") else str(u.get('speaker'))
                  distinct_speakers_set.add(spk)
                  raw_start_sec = round(float(u.get("start", 0)) / 1000.0, 3)
                  raw_end_sec = round(float(u.get("end", 0)) / 1000.0, 3)
                  abs_start_sec = round(raw_start_sec + time_offset_sec, 3)
                  abs_end_sec = round(raw_end_sec + time_offset_sec, 3)
                  all_utterances.append({
                      "start": abs_start_sec,
                      "end": abs_end_sec,
                      "start_ms": int(abs_start_sec * 1000),
                      "end_ms": int(abs_end_sec * 1000),
                      "speaker": spk,
                      "text": u.get("text", "").strip(),
                      "confidence": u.get("confidence")
                  })

          distinct_speakers = sorted(list(distinct_speakers_set))
          avg_confidence = round(total_conf_sum / conf_count, 4) if conf_count else None
          print(f"\n✅ All chunks transcribed successfully!")
          print(f"  Model used: {model_used}")
          print(f"  Average confidence: {avg_confidence}")
          print(f"  Speakers detected ({len(distinct_speakers)}): {', '.join(distinct_speakers)}")
          print(f"  Total utterances: {len(all_utterances)}")

          lines = []
          for u in all_utterances:
              lines.append(f"[{fmt(u['start'])} - {fmt(u['end'])}] {u['speaker']}: {u['text']}")

          if not lines and all_texts:
              lines.append("\n\n".join(all_texts))

          with open(txt_path, "w", encoding="utf-8") as f:
              f.write("\n\n".join(lines))

          with open(json_path, "w", encoding="utf-8") as f:
              json.dump({
                  "release_tag": release_tag,
                  "model_used": model_used,
                  "confidence": avg_confidence,
                  "audio_duration": duration_sec or None,
                  "speakers_count": len(distinct_speakers),
                  "speakers": distinct_speakers,
                  "segments": all_utterances,
                  "text": "\n\n".join(all_texts)
              }, f, indent=2)

          print(f"📄 Transcript saved: {txt_path} ({len(lines)} speaker turns)")
          print(f"📊 JSON data saved: {json_path}")
          PYEOF

      - name: Upload transcripts to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading transcripts to release ${{ inputs.release_tag }}..."
          gh release upload "${{ inputs.release_tag }}" transcripts/*.txt transcripts/*.json --clobber
          echo "✅ Transcripts successfully uploaded to GitHub Release."

