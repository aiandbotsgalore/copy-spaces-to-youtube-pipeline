name: Transcribe Episode
run-name: Transcribe ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to transcribe (e.g. 20260902_1AJEmvwnykXJL)'
        required: true
        type: string

concurrency:
  group: transcribe-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install modal requests

      - name: Run Modal Cloud GPU Transcription
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "[*] Triggering Modal Serverless GPU transcription for ${{ inputs.release_tag }}..."
          MAX_ATTEMPTS=4
          ATTEMPT=1
          until modal run modal_transcriber.py --release-tag "${{ inputs.release_tag }}"; do
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "[!] Modal execution failed after $MAX_ATTEMPTS attempts."
              exit 1
            fi
            SLEEP_SEC=$((ATTEMPT * 30))
            echo "[!] Modal run encountered transient issue or rate limit. Retrying in ${SLEEP_SEC}s (Attempt $ATTEMPT/$MAX_ATTEMPTS)..."
            sleep $SLEEP_SEC
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Trigger RSS Update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update_rss.yml --ref master || echo "[!] Note: Could not trigger update_rss.yml"
