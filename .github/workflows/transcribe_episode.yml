name: Transcribe Episode
run-name: Transcribe ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to transcribe (e.g. 20260902_1AJEmvwnykXJL)'
        required: true
        type: string
      force:
        description: 'Force re-transcription even if transcript already exists'
        required: false
        default: true
        type: boolean

concurrency:
  group: transcribe-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Deepgram Cloud Audio Transcription
        id: transcribe_step
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "[*] Triggering Deepgram Nova-2 cloud transcription for ${{ inputs.release_tag }}..."
          FORCE_ARG=""
          if [ "${{ inputs.force }}" != "false" ]; then
            FORCE_ARG="--force"
          fi
          python scripts/deepgram_transcriber.py --release-tag "${{ inputs.release_tag }}" $FORCE_ARG

      - name: Rebuild Transcripts Search Index
        if: always() && steps.transcribe_step.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_transcripts_index.py || echo "[!] Warning: Failed to rebuild transcripts search index"

      - name: Commit Updated Search Index
        if: always() && steps.transcribe_step.outcome == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/transcripts/transcripts_search_index.json public/transcripts/transcription_status.json || true
          git commit -m "chore(transcripts): update search index for ${{ inputs.release_tag }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin master || true
          git push origin master || echo "Push skipped or already up to date"

      - name: Trigger RSS Update
        if: always() && steps.transcribe_step.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update_rss.yml --ref master || echo "[!] Note: Could not trigger update_rss.yml"
