name: Transcribe Episode
run-name: Transcribe ${{ inputs.release_tag }} via AssemblyAI Cloud

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to transcribe (e.g. 20260902_1AJEmvwnykXJL)'
        required: true
        type: string
      force:
        description: 'Force re-transcription even if transcript already exists'
        required: false
        default: true
        type: boolean

concurrency:
  group: transcribe-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-worker.txt'

      - name: Install Dependencies
        run: pip install -r requirements-worker.txt

      - name: Transcribe Episode via AssemblyAI Cloud
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          FORCE_ARG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          echo "[*] Transcribing ${{ inputs.release_tag }} via AssemblyAI Cloud..."
          python scripts/transcribe_and_diarize.py --release-tag "${{ inputs.release_tag }}" $FORCE_ARG

      - name: Rebuild Transcript Index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_transcripts_index.py

      - name: Commit & Push Updated Transcripts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/transcripts/
          git commit -m "chore(transcripts): update transcript index for ${{ inputs.release_tag }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin master || true
          git push origin master || echo "Notice: Push skipped or up to date"

      - name: Trigger Web App & RSS Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run update_rss.yml --ref master || echo "[!] Note: Could not trigger update_rss.yml"
