name: Transcribe Episode
run-name: Transcribe ${{ inputs.release_tag }} via Modal Cloud GPU

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to transcribe (e.g. 20260902_1AJEmvwnykXJL)'
        required: true
        type: string
      force:
        description: 'Force re-transcription even if transcript already exists'
        required: false
        default: true
        type: boolean

concurrency:
  group: transcribe-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  transcribe-modal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Transcribe Episode on Modal Cloud GPU
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "[*] Transcribing ${{ inputs.release_tag }} on Modal Cloud GPU..."
          python scripts/modal_transcribe_client.py --release-tag "${{ inputs.release_tag }}"
