name: Transcribe Episode

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to transcribe (e.g. 20260503_1qGvvkOdEAzGB)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -q assemblyai

      - name: Download MP3 from release
        id: download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers={"Authorization": f"token {token}", "Accept": "application/vnd.github+json"},
          )
          try:
              with urllib.request.urlopen(req) as r:
                  release = json.loads(r.read())
          except Exception as e:
              print(f"::error::Could not fetch release {tag}: {e}")
              sys.exit(1)

          assets = release.get("assets", [])
          existing_transcript = next((a for a in assets if "transcript" in a["name"].lower() and a["name"].lower().endswith((".txt", ".json"))), None)
          if existing_transcript:
              print(f"Transcript asset already exists: {existing_transcript['name']}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as gho:
                  gho.write("already_transcribed=true\n")
              sys.exit(0)

          mp3_asset = next((a for a in assets if a["name"].lower().endswith(".mp3")), None)
          if not mp3_asset:
              print(f"::error::No MP3 asset found in release {tag}")
              sys.exit(1)

          mp3_url = mp3_asset["browser_download_url"]
          mp3_name = mp3_asset["name"]
          os.makedirs("work", exist_ok=True)
          out_path = f"work/{mp3_name}"
          print(f"Downloading {mp3_name} ({mp3_asset['size'] // (1024*1024)} MB)...")
          req2 = urllib.request.Request(mp3_url, headers={"Authorization": f"token {token}"})
          with urllib.request.urlopen(req2) as r, open(out_path, "wb") as f:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk:
                      break
                  f.write(chunk)
          print(f"Downloaded to {out_path}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gho:
              gho.write("already_transcribed=false\n")
              gho.write(f"mp3_path={out_path}\n")
          PYEOF

      - name: Transcribe with AssemblyAI
        id: transcribe
        if: steps.download.outputs.already_transcribed != 'true'
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          MP3_PATH: ${{ steps.download.outputs.mp3_path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p transcripts
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          import time
          import urllib.request

          api_key = os.environ.get("ASSEMBLYAI_API_KEY", "")
          if not api_key:
              print("::error::ASSEMBLYAI_API_KEY secret is not set.")
              sys.exit(1)
          mp3_path = os.environ.get("MP3_PATH", "")
          release_tag = os.environ.get("RELEASE_TAG", "")
          if not mp3_path or not os.path.exists(mp3_path):
              print(f"::error::MP3 file not found: {mp3_path}")
              sys.exit(1)

          base_name = os.path.splitext(os.path.basename(mp3_path))[0]
          txt_path = f"transcripts/{base_name}.transcript.txt"
          json_path = f"transcripts/{base_name}.transcript.json"

          def fmt(ms):
              s = int(ms) // 1000
              return f"{s // 3600:02d}:{(s % 3600) // 60:02d}:{s % 60:02d}"

          audio_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{release_tag}/{os.path.basename(mp3_path)}"
          payload = json.dumps({
              "audio_url": audio_url,
              "speech_model": "universal-2",
              "speaker_labels": True,
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.assemblyai.com/v2/transcript",
              data=payload,
              headers={"Authorization": api_key, "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              transcript = json.loads(r.read())
          transcript_id = transcript.get("id")
          if not transcript_id:
              print("::error::AssemblyAI did not return a transcript id.")
              sys.exit(1)

          poll_url = f"https://api.assemblyai.com/v2/transcript/{transcript_id}"
          transcript = None
          for _ in range(180):
              poll_req = urllib.request.Request(poll_url, headers={"Authorization": api_key})
              with urllib.request.urlopen(poll_req) as r:
                  transcript = json.loads(r.read())
              status = transcript.get("status")
              if status == "completed":
                  break
              if status == "error":
                  print(f"::error::AssemblyAI transcription failed: {transcript.get('error')}")
                  sys.exit(1)
              time.sleep(10)
          if not transcript or transcript.get("status") != "completed":
              print("::error::AssemblyAI transcription timed out.")
              sys.exit(1)

          lines, segments = [], []
          utterances = transcript.get("utterances") or []
          if utterances:
              for u in utterances:
                  lines.append(f"[{fmt(u['start'])} - {fmt(u['end'])}] Speaker {u['speaker']}: {u['text'].strip()}")
                  segments.append({"start": u["start"], "end": u["end"], "speaker": u["speaker"], "text": u["text"].strip()})
          else:
              text = transcript.get("text", "").strip()
              if text:
                  lines.append(text)

          with open(txt_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          with open(json_path, "w", encoding="utf-8") as f:
              json.dump({"release_tag": release_tag, "transcript_id": transcript.get("id"), "segments": segments, "text": transcript.get("text", "")}, f, indent=2)
          print(f"Transcript saved: {txt_path} ({len(lines)} line(s))")
          print(f"JSON data saved: {json_path}")
          PYEOF

      - name: Upload transcripts to release
        if: steps.download.outputs.already_transcribed != 'true'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            transcripts/*.transcript.txt
            transcripts/*.transcript.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
