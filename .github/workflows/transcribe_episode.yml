name: Transcribe Episode

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to transcribe (e.g. 20260503_1qGvvkOdEAzGB)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -q assemblyai

      - name: Download MP3 from Release
        id: download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, sys
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers={"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
          )
          try:
              with urllib.request.urlopen(req) as r:
                  release = json.loads(r.read())
          except Exception as e:
              print(f"::error::Could not fetch release {tag}: {e}")
              sys.exit(1)
          mp3_asset = next((a for a in release.get("assets", []) if a["name"].endswith(".mp3")), None)
          if not mp3_asset:
              print(f"::error::No MP3 asset found in release {tag}")
              sys.exit(1)
          mp3_url = mp3_asset["browser_download_url"]
          mp3_name = mp3_asset["name"]
          os.makedirs("work", exist_ok=True)
          out_path = f"work/{mp3_name}"
          print(f"Downloading {mp3_name} ({mp3_asset['size'] // (1024*1024)} MB)...")
          req2 = urllib.request.Request(mp3_url, headers={"Authorization": f"token {token}"})
          with urllib.request.urlopen(req2) as r, open(out_path, "wb") as f:
              f.write(r.read())
          print(f"Downloaded to {out_path}")
          release_name = release.get("name") or release.get("tag_name") or tag
          with open(os.environ["GITHUB_OUTPUT"], "a") as gho:
              gho.write(f"mp3_path={out_path}\n")
              gho.write(f"release_name={release_name}\n")
          PYEOF

      - name: Transcribe with AssemblyAI
        id: transcribe
        env:
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          MP3_PATH: ${{ steps.download.outputs.mp3_path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ steps.download.outputs.release_name }}
        run: |
          mkdir -p transcripts
          python3 - <<'PYEOF'
          import os, sys, json, time, urllib.request, re, subprocess

          api_key = os.environ.get("ASSEMBLYAI_API_KEY", "")
          if not api_key:
              print("::error::ASSEMBLYAI_API_KEY secret is not set.")
              sys.exit(1)

          mp3_path = os.environ.get("MP3_PATH", "")
          release_tag = os.environ.get("RELEASE_TAG", "")
          release_name = os.environ.get("RELEASE_NAME", "") or release_tag
          if not mp3_path or not os.path.exists(mp3_path):
              print(f"::error::MP3 file not found: {mp3_path}")
              sys.exit(1)

          base_name = os.path.splitext(os.path.basename(mp3_path))[0]
          txt_path = f"transcripts/{base_name}.txt"
          json_path = f"transcripts/{base_name}.json"

          def fmt(sec):
              s = int(sec)
              return f"{s // 3600:02d}:{(s % 3600) // 60:02d}:{s % 60:02d}"

          # Plan A: Speech-band filter & loudnorm leveling pass
          opt_path = f"work/{base_name}_speech_opt.mp3"
          print(f"🎛️ Condition audio for speech: bandpass (75Hz-8.5kHz), loudnorm leveling, 24kHz mono...")
          ffmpeg_cmd = [
              "ffmpeg", "-y", "-i", mp3_path,
              "-af", "highpass=f=75,lowpass=f=8500,loudnorm=I=-16:LRA=11:TP=-1.5",
              "-ar", "24000", "-ac", "1",
              "-c:a", "libmp3lame", "-b:a", "64k",
              opt_path
          ]
          res = subprocess.run(ffmpeg_cmd, capture_output=True, text=True)
          upload_target = opt_path if res.returncode == 0 and os.path.exists(opt_path) else mp3_path
          if upload_target == opt_path:
              orig_mb = os.path.getsize(mp3_path) / (1024 * 1024)
              opt_mb = os.path.getsize(opt_path) / (1024 * 1024)
              print(f"✨ Speech optimized: {orig_mb:.1f} MB -> {opt_mb:.1f} MB ({(1 - opt_mb/orig_mb)*100:.0f}% reduction)")
          else:
              print(f"⚠️ Warning: ffmpeg enhancement failed ({res.stderr}), using original audio.")

          print(f"📤 Uploading speech-conditioned audio to AssemblyAI...")
          upload_req = urllib.request.Request(
              "https://api.assemblyai.com/v2/upload",
              data=open(upload_target, "rb").read(),
              headers={"Authorization": api_key},
              method="POST"
          )
          with urllib.request.urlopen(upload_req, timeout=3600) as r:
              upload_res = json.loads(r.read())
              audio_url = upload_res["upload_url"]
          print(f"✅ Uploaded to AssemblyAI (audio URL ready)")

          print(f"🚀 Requesting AssemblyAI Universal-3.5 Pro transcription...")

          base_keyterms = [
              "LoganBlack", "Logan Black", "Rick Doty", "Richard Doty", "Shane", "Oor",
              "Lana", "Pants Down", "UAP", "UFO", "UFOs", "PeruAliens", "David Grusch",
              "disclosure", "extraterrestrial", "NHI", "A.I."
          ]
          if release_name:
              title_words = [w for w in re.split(r'[^a-zA-Z0-9]', release_name) if len(w) > 2]
              keyterms = list(dict.fromkeys(base_keyterms + title_words[:15]))
          else:
              keyterms = base_keyterms

          payload = json.dumps({
              "audio_url": audio_url,
              "speech_models": ["universal-3-5-pro", "universal-2"],
              "language_code": "en",
              "punctuate": True,
              "format_text": True,
              "speaker_labels": True,
              "prompt": "Live X Space discussion covering UAP, UFOs, paranormal topics, science, technology, government, disclosure, and related current events.",
              "keyterms_prompt": keyterms,
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.assemblyai.com/v2/transcript",
              data=payload,
              headers={
                  "Authorization": api_key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as r:
                  transcript = json.loads(r.read())
          except urllib.error.HTTPError as he:
              print(f"::error::AssemblyAI HTTP error on request: {he.code} - {he.read().decode('utf-8', errors='replace')}")
              sys.exit(1)
          except Exception as e:
              print(f"::error::AssemblyAI request exception: {e}")
              sys.exit(1)

          transcript_id = transcript.get("id")
          if not transcript_id:
              print(f"::error::AssemblyAI did not return a transcript id. Response: {transcript}")
              sys.exit(1)
          print(f"⏳ Transcript queued with ID: {transcript_id}. Polling for completion...")

          poll_url = f"https://api.assemblyai.com/v2/transcript/{transcript_id}"
          transcript = None
          for attempt in range(180):
              poll_req = urllib.request.Request(poll_url, headers={"Authorization": api_key})
              try:
                  with urllib.request.urlopen(poll_req) as r:
                      transcript = json.loads(r.read())
              except Exception as pe:
                  print(f"  Warning: poll request error: {pe}, retrying...")
                  time.sleep(10)
                  continue

              status = transcript.get("status")
              if status == "completed":
                  break
              if status == "error":
                  print(f"::error::AssemblyAI transcription failed with status 'error'!")
                  print(f"  Transcript ID: {transcript_id}")
                  print(f"  Error message: {transcript.get('error')}")
                  sys.exit(1)
              if attempt % 6 == 0:
                  print(f"  [{attempt * 10}s] Status: {status}...")
              time.sleep(10)

          if not transcript or transcript.get("status") != "completed":
              print(f"::error::AssemblyAI transcription timed out after 30 minutes. Last state: {transcript}")
              sys.exit(1)

          utterances = transcript.get("utterances") or []
          distinct_speakers = sorted(list(set(str(u.get('speaker')) for u in utterances)))
          model_used = transcript.get("speech_model_used") or "universal-3-5-pro"
          print(f"✅ Transcription completed successfully!")
          print(f"  Transcript ID: {transcript.get('id')}")
          print(f"  Model used: {model_used}")
          print(f"  Confidence: {transcript.get('confidence')}")
          print(f"  Audio Duration: {transcript.get('audio_duration')}s")
          print(f"  Speakers detected ({len(distinct_speakers)}): {', '.join(distinct_speakers)}")
          print(f"  Total utterances: {len(utterances)}")

          lines, segments = [], []
          for u in utterances:
              spk = f"Speaker {u['speaker']}" if not str(u['speaker']).startswith("Speaker") else str(u['speaker'])
              start_sec = round(float(u.get("start", 0)) / 1000.0, 3)
              end_sec = round(float(u.get("end", 0)) / 1000.0, 3)
              lines.append(f"[{fmt(start_sec)} - {fmt(end_sec)}] {spk}: {u['text'].strip()}")
              segments.append({
                  "start": start_sec,
                  "end": end_sec,
                  "start_ms": u.get("start"),
                  "end_ms": u.get("end"),
                  "speaker": spk,
                  "text": u["text"].strip(),
                  "confidence": u.get("confidence")
              })

          if not lines and transcript.get("text"):
              lines.append(transcript.get("text", "").strip())

          with open(txt_path, "w", encoding="utf-8") as f:
              f.write("\n\n".join(lines))

          with open(json_path, "w", encoding="utf-8") as f:
              json.dump({
                  "release_tag": release_tag,
                  "transcript_id": transcript.get("id"),
                  "model_used": model_used,
                  "confidence": transcript.get("confidence"),
                  "audio_duration": transcript.get("audio_duration"),
                  "speakers_count": len(distinct_speakers),
                  "speakers": distinct_speakers,
                  "segments": segments,
                  "text": transcript.get("text", "")
              }, f, indent=2)

          print(f"📄 Transcript saved: {txt_path} ({len(lines)} speaker turns)")
          print(f"📊 JSON data saved: {json_path}")
          PYEOF

      - name: Upload transcripts to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" transcripts/* --clobber
