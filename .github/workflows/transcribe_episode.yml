name: Transcribe Episode
run-name: Transcribe ${{ inputs.release_tag }} via Kaggle Dual-T4 GPU

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to transcribe (e.g. 20260902_1AJEmvwnykXJL)'
        required: true
        type: string
      force:
        description: 'Force re-transcription even if transcript already exists'
        required: false
        default: true
        type: boolean

concurrency:
  group: transcribe-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  dispatch-gpu:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Kaggle Dual-T4 GPU Transcription
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Forwarding transcription request for ${{ inputs.release_tag }} to Kaggle Dual-T4 GPU worker..."
          gh workflow run kaggle_transcribe.yml -f release_tag="${{ inputs.release_tag }}"
