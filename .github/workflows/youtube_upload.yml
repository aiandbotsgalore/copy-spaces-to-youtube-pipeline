name: YouTube Upload

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch id"
        required: true
        type: string
      space_id:
        description: "Space id"
        required: true
        type: string
      state_branch:
        description: "State branch"
        required: false
        type: string
        default: "pipeline-state"

permissions:
  contents: write
  actions: write

concurrency:
  group: youtube-upload-${{ inputs.batch_id }}-${{ inputs.space_id }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-httplib2

      - name: Upload to YouTube
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_MOCK_UPLOAD: ${{ vars.YOUTUBE_MOCK_UPLOAD }}
        run: |
          python scripts/youtube_upload.py \
            --repo "$REPO" \
            --token "$GH_TOKEN" \
            --state-branch "${{ inputs.state_branch }}" \
            --batch-id "${{ inputs.batch_id }}" \
            --space-id "${{ inputs.space_id }}" \
            --visibility "private" \
            --category "Podcasts & Blogs"
